<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô hình dữ liệu quan hệ</title>
<style>
/* Bản HTML tương tác — cùng hệ màu với bản .pptx (mẫu DAU).
   Sân khấu logic 1280x720 (13.333x7.5in @96dpi), scale theo cửa sổ. 1pt = 1.3333px */
:root {
  --brand:#A63A3A; --deep:#7E2B2B; --tint:#F6EEEC; --tintline:#E6D3D0;
  --card:#FBFAF9; --line:#E5E2DF; --ink:#1F1F22; --ink2:#4A4A50; --ink3:#7A7674;
  --ok:#1E7A4B; --okbg:#EAF6EF; --bad:#B3261E; --badbg:#FCEEED;
  --font:Arial,"Segoe UI",Helvetica,sans-serif; --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2A2A2E;font-family:var(--font);color:var(--ink);overflow:hidden}

#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;background:#fff;position:relative;
  transform:scale(var(--scale));transform-origin:center;box-shadow:0 18px 60px rgba(0,0,0,.45);overflow:hidden}

.slide:not(.on){display:none!important}
.slide{position:absolute;inset:0;padding:40px 86px 0}
.slide.on{display:block}

/* ---- khung chung ---- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:24px}
.hd h2{font-size:37px;font-weight:700;margin:0;line-height:1.15}
.chip{flex:0 0 auto;background:var(--tint);color:var(--deep);font-size:17px;font-weight:700;
  padding:7px 15px;border-radius:18px;white-space:nowrap}
.rule{position:relative;height:1px;background:var(--line);margin-top:16px}
.rule::before{content:"";position:absolute;left:0;top:-2px;width:110px;height:4px;background:var(--brand)}
.body{padding-top:22px}
.ft{position:absolute;left:86px;right:86px;bottom:24px;display:flex;justify-content:space-between;
  font-size:12px;color:var(--ink3)}
.lead{font-size:20px;color:var(--ink3);margin:0 0 14px}
.note{position:relative;background:var(--tint);border-radius:6px;padding:13px 18px 13px 22px;
  font-size:20px;color:var(--ink2);margin-top:18px}
.note::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;background:var(--brand);border-radius:3px 0 0 3px}

/* ---- title / edge ---- */
.edge::before{content:"";position:absolute;left:0;top:0;width:19px;height:100%;background:var(--brand)}
.edge::after{content:"";position:absolute;left:19px;top:0;width:4px;height:100%;background:var(--tint)}
.slide.title{display:flex;flex-direction:column;justify-content:center;padding:0 86px 0 120px}
.title .tlogo{width:96px;height:96px;object-fit:contain;background:#fff;
  border:1px solid var(--tintline,#E6D3D0);padding:10px;margin-bottom:22px}
.title .org{font-size:16px;font-weight:700;color:var(--brand);letter-spacing:.6px}
.title h1{font-size:48px;font-weight:700;margin:14px 0 0;line-height:1.15}
.title .bar{width:163px;height:6px;background:var(--brand);margin:22px 0 20px}
.title .sub{font-size:32px;color:var(--ink2)}
.title .who{border-left:3px solid var(--tintline);padding-left:16px;margin-top:30px;font-size:20px;color:var(--ink3)}

/* ---- objectives ---- */
.goal{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:8px;padding:12px 20px;margin-bottom:10px}
.goal .n{flex:0 0 42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:700}
.goal .tx b{font-size:24px;display:block}
.goal .tx span{font-size:19px;color:var(--ink2)}
.goal .tag{margin-left:auto;flex:0 0 auto;color:var(--deep);font-size:15px;font-weight:700;white-space:nowrap}

/* ---- bullets ---- */
.pt{display:flex;gap:16px;margin-bottom:16px}
.pt .d{flex:0 0 10px;height:10px;border-radius:2px;background:var(--brand);margin-top:11px}
.pt span{font-size:27px;line-height:1.3}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:42px}
.panel{background:var(--card);border-radius:8px;overflow:hidden}
.panel .ph{background:var(--tint);border-bottom:2px solid var(--tintline);padding:14px 22px;
  font-size:21px;font-weight:700;color:var(--deep);text-transform:uppercase;letter-spacing:.6px}
.panel .pb{padding:16px 22px}
.panel .pt span{font-size:24px}

/* ---- image-text ---- */
.figsplit{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start}
.fig img{max-width:100%;max-height:370px;border:1px solid var(--line);border-radius:6px}
.figbox{width:100%;height:340px;background:var(--card);border:1px dashed var(--tintline);
  border-radius:6px;display:grid;place-items:center;color:var(--ink3);font-size:20px}
.cap{font-size:20px;color:var(--ink2);margin-top:12px}
.src{font-size:16px;color:var(--ink3);margin-top:4px}
.subhead{font-size:20px;font-weight:700;color:var(--deep);letter-spacing:.8px}
.subhead+.ul{width:72px;height:4px;background:var(--tintline);margin:8px 0 18px}

/* ---- diagram ---- */
.flow{display:flex;align-items:stretch;gap:14px;margin-top:26px}
.flow .st{flex:1;background:var(--card);border-radius:8px;border-top:5px solid var(--brand);
  padding:18px 16px;text-align:center}
.flow .st .n{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:700;margin:0 auto 12px}
.flow .st b{font-size:24px;display:block;margin-bottom:8px}
.flow .st span{font-size:19px;color:var(--ink3)}
.flow .ar{align-self:center;color:var(--tintline);font-size:34px;font-weight:700}

/* ---- question / quiz ---- */
.q{position:relative;background:var(--tint);border-radius:8px;padding:18px 22px 18px 26px;
  font-size:29px;font-weight:700;line-height:1.3;margin-bottom:18px}
.q::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:6px;background:var(--brand);border-radius:3px 0 0 3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid transparent;
  border-radius:8px;padding:14px 18px;cursor:pointer;font-size:24px;text-align:left;width:100%;
  font-family:var(--font);color:var(--ink)}
.opt:hover:not(.lock){background:var(--tint)}
.opt .k{flex:0 0 42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--tintline);
  display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--deep)}
.opt.pick{border-color:var(--brand);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.lock{cursor:default}
.fb{margin-top:16px;border-radius:8px;padding:14px 20px;font-size:22px;line-height:1.45;display:none}
.fb.on{display:block}
.fb.good{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:4px}

.btn{font-family:var(--font);font-size:19px;font-weight:700;background:var(--brand);color:#fff;
  border:0;border-radius:6px;padding:11px 22px;cursor:pointer}
.btn:hover{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--tintline)}
.row{display:flex;gap:12px;margin-top:16px}

/* ---- reveal ---- */
.rv{background:var(--card);border-radius:8px;padding:14px 20px;margin-bottom:11px;cursor:pointer;
  border-left:4px solid var(--tintline)}
.rv.open{border-left-color:var(--ok);background:var(--okbg)}
.rv b{font-size:24px;display:block}
.rv .a{display:none;margin-top:9px;font-size:21px;color:var(--ink2);line-height:1.45;
  padding-top:9px;border-top:1px dashed var(--tintline)}
.rv.open .a{display:block}
.rv .h{float:right;font-size:16px;color:var(--ink3)}

/* ---- match (kéo–thả) ---- */
.match{display:grid;grid-template-columns:1.45fr 1fr;gap:30px}
.slotrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.slotrow .lb{flex:1;font-size:21px}
.slot{flex:0 0 210px;min-height:46px;border:2px dashed var(--tintline);border-radius:6px;
  display:grid;place-items:center;font-size:18px;color:var(--ink3);background:var(--card);padding:6px 10px;cursor:pointer}
.slot.fill{border-style:solid;background:var(--tint);color:var(--deep);font-weight:700}
.slot.over{border-color:var(--brand);background:var(--tint)}
.slot.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.slot.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.bank::before{content:"NGÂN HÀNG ĐÁP ÁN";width:100%;font-size:15px;letter-spacing:.8px;color:var(--ink3)}
.tok{background:var(--tint);border:2px solid var(--tintline);border-radius:6px;padding:10px 14px;
  font-size:19px;cursor:grab;user-select:none;color:var(--deep);font-weight:700}
.tok.sel{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(166,58,58,.18)}
.tok.used{display:none}

/* ---- practice ---- */
.chips{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chips .c{background:var(--tint);color:var(--deep);font-size:18px;font-weight:700;padding:8px 16px;border-radius:6px}
.box{background:var(--card);border-left:4px solid var(--brand);border-radius:6px;padding:14px 20px;margin-bottom:12px}
.box h4{margin:0 0 8px;font-size:16px;letter-spacing:.8px;color:var(--deep)}
.task{display:flex;gap:12px;align-items:flex-start;font-size:21px;color:var(--ink2);margin-bottom:8px;cursor:pointer}
.task input{width:20px;height:20px;margin-top:4px;accent-color:var(--brand)}
.task.done{color:var(--ink3);text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ---- open (thảo luận) ---- */
.ta{width:100%;min-height:120px;border:2px solid var(--line);border-radius:8px;padding:12px 14px;
  font-family:var(--font);font-size:21px;resize:none}
.ta:focus{outline:none;border-color:var(--brand)}
.hints{margin-top:14px;display:none}
.hints .h{background:var(--card);border-left:4px solid var(--tintline);border-radius:6px;
  padding:10px 16px;font-size:20px;color:var(--ink2);margin-bottom:8px}

/* ---- results ---- */
.score{display:grid;place-items:center;padding-top:14px}
.score .big{font-size:84px;font-weight:700;color:var(--deep);line-height:1}
.score .lab{font-size:21px;color:var(--ink3);margin-top:6px}
.score .rows{width:100%;margin-top:22px}
.score .r{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:20px}
.score .s{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.score .s.ok{background:var(--ok)}.score .s.no{background:var(--bad)}.score .s.na{background:#B9B5B2}

/* ---- vỏ điều khiển ---- */
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--brand);width:0;transition:width .2s;z-index:5}
#hud{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;font-size:13px;color:#EDEAE8;z-index:20}
#hud button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:5px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--font)}
#hud button:hover{background:rgba(255,255,255,.25)}
#pos{font-variant-numeric:tabular-nums;opacity:.8}
#clock{font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);
  border-radius:5px;padding:7px 12px;opacity:.55}
#clock.run{opacity:1;background:rgba(255,255,255,.22)}
#clock.over{background:var(--bad);color:#fff;opacity:1}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:#17171A;color:#E8E4E1;
  padding:16px 26px 22px;font-size:15px;line-height:1.6;border-top:3px solid var(--brand);display:none;z-index:25}
#notes.on{display:block}
#notes h5{margin:0 0 6px;font-size:12px;letter-spacing:1.2px;color:#E0A9A9;text-transform:uppercase}
#grid{position:fixed;inset:0;background:#1B1B1F;z-index:30;display:none;grid-template-columns:repeat(5,1fr);
  gap:12px;padding:26px;overflow:auto;align-content:start}
#grid.on{display:grid}
#grid .g{background:#fff;border-radius:6px;padding:12px;cursor:pointer;border:3px solid transparent;min-height:88px}
#grid .g.cur{border-color:var(--brand)}
#grid .gi{font-size:11px;color:var(--ink3)}
#grid .gm{float:right;font-weight:700;color:var(--brand)}
#grid .gt{font-size:13px;font-weight:700;margin-top:4px;line-height:1.25}
#grid .gp{font-size:10px;color:var(--brand);text-transform:uppercase;letter-spacing:.6px;margin-top:6px}

body.shot #hud,body.shot #notes,body.shot #bar{display:none!important}
body.shot{background:#fff}body.shot #stage{box-shadow:none}

</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="bar"></div></div></div>
<div id="notes"></div>
<div id="grid"></div>
<div id="hud">
  <span id="clock" title="Đồng hồ tiết dạy — T chạy/dừng, R đặt lại">00:00</span>
  <span id="pos">–</span>
  <button id="prev" title="Slide trước (←)">←</button>
  <button id="next" title="Slide sau (→)">→</button>
  <button id="tg" title="Tổng quan (O)">Tổng quan</button>
  <button id="tn" title="Kịch bản giảng viên (N)">Kịch bản</button>
</div>

Mục tiêu buổi học", "objective": "Công bố chuẩn đầu ra của buổi hai.", "emphasis": [2], "notes": "Năm mục tiêu chia ba nhóm quen thuộc. Mục tiêu thứ ba được làm nổi bật vì bốn quy tắc ánh xạ là nội dung được đề cương đánh dấu sao, và cũng là kỹ năng dùng trực tiếp trong đồ án. Mục tiêu thứ tư đáng chú ý vì nó yêu cầu chứng minh chứ không phải ghi nhớ."}, {"layout": "diagram", "phase": "khoi-dong", "minutes": 2, "title": "Lộ trình buổi học", "steps": [{"label": "Hai ràng buộc", "desc": "Toàn vẹn thực thể và tham chiếu"}, {"label": "Bốn quy tắc", "desc": "Dịch lược đồ ER thành bảng"}, {"label": "Ba ca còn lại", "desc": "Yếu, đệ quy, phân cấp cha con"}, {"label": "Chọn phương án", "desc": "Ràng buộc quyết định cấu trúc"}], "note": "Chặng hai chứa chứng minh quan trọng nhất của cả chương.", "objective": "Cho bản đồ để sinh viên định vị trong buổi học.", "notes": "Bốn chặng hôm nay đi từ luật tới cách làm. Chặng một là hai luật bảo vệ dữ liệu. Chặng hai là bốn quy tắc dịch, trong đó có một chứng minh mà đề cương gọi là làm sai để thấy vì sao. Chặng ba xử lý ba ca đã gặp ở chương hai. Chặng cuối cho thấy quyết định ở mức quan niệm chi phối cấu trúc bảng ra sao."}, {"layout": "quiz", "phase": "khoi-dong", "minutes": 3, "role": "diagnostic", "title": "Nối lại mạch bài học", "question": "Trong bảng HOCVIEN, cột MALOP là khóa chính của bảng LOP. Vậy MALOP ở đây là loại khóa gì?", "options": ["Khóa chính", "Khóa dự tuyển", "Khóa ngoại", "Khóa phụ"], "answer": 2, "explain": "Khóa ngoại là thuộc tính nằm ở bảng này nhưng là khóa chính của bảng khác, và chính nó tạo ra mối nối giữa hai bảng. Buổi hôm nay sẽ học luật bảo vệ loại khóa này, và học cách sinh ra nó khi ánh xạ từ lược đồ ER.", "objective": "Kiểm tra mức nắm năm loại khóa trước khi vào bài.", "notes": "Câu này chẩn đoán nhanh và bắc cầu sang nội dung chính. Khóa ngoại là nhân vật chính của cả buổi hôm nay: nó vừa là đối tượng của ràng buộc toàn vẹn tham chiếu, vừa là kết quả của ba trong bốn quy tắc ánh xạ. Nếu lớp còn lẫn thì dành thêm một phút nhắc lại bảng năm loại khóa."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Toàn vẹn thực thể", "bullets": ["Khóa chính phải duy nhất và không được nhận giá trị rỗng", "Rỗng nghĩa là dòng đó không có danh tính", "Trùng nghĩa là hai dòng có cùng danh tính", "Khóa phức hợp thì ràng buộc áp cho từng thành phần"], "note": "Ghi nhớ: trong GHIDANH, cả mã học viên lẫn mã lớp đều không được rỗng.", "emphasis": [1], "objective": "Nắm ràng buộc thứ nhất và lý do của nó.", "notes": "Lý do rất trực tiếp nên đừng học thuộc. Khóa chính tồn tại để định danh một dòng; nếu nó rỗng thì không có cách nào chỉ đích danh dòng ấy để đọc, sửa hay xóa. Dòng cuối cùng hay bị quên: với khóa phức hợp, ràng buộc áp cho từng thành phần chứ không phải cho cả cặp."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Toàn vẹn tham chiếu", "bullets": ["Khóa ngoại hoặc là rỗng, hoặc phải khớp một khóa chính đang tồn tại", "Ràng buộc này ngăn hiện tượng tham chiếu mồ côi", "Tham chiếu mồ côi là dòng trỏ tới thứ không tồn tại", "Hệ quản trị chặn ngay tại thời điểm nhập liệu"], "note": "Ghi nhớ: hoặc rỗng, hoặc trỏ đúng; không có khả năng thứ ba.", "emphasis": [0], "objective": "Nắm ràng buộc thứ hai và tên gọi của lỗi nó ngăn.", "notes": "Cách phát biểu ở dòng đầu rất gọn và đáng thuộc: hoặc rỗng, hoặc trỏ đúng, không có khả năng thứ ba. Điểm mạnh nằm ở dòng cuối: hệ quản trị chặn ngay lúc nhập chứ không đợi tới lúc chạy báo cáo mới phát hiện. Đó là khác biệt căn bản so với việc kiểm tra bằng mã chương trình."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ví dụ: tham chiếu mồ côi", "bullets": ["Bảng LOP có dòng A5 với mã người phụ trách là GV99", "Nhưng bảng GIAOVIEN không có ai mang mã GV99", "Vậy lớp A5 đang do một người không tồn tại phụ trách", "Toàn vẹn tham chiếu chặn đúng tình huống này"], "note": "Lưu ý: không có ràng buộc thì lỗi này chỉ lộ ra khi chạy báo cáo.", "emphasis": [2], "objective": "Thấy "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Tính tham gia quyết định khóa ngoại", "bullets": ["Quy tắc 3 nói người phụ trách có thể chưa có lớp nào", "Nhưng mọi lớp đều bắt buộc phải có người phụ trách", "Nên cột mã người phụ trách trong bảng LOP không được rỗng", "Đổi quy tắc thành lớp có thể chưa phân người thì cột ấy được rỗng"], "note": "Ghi nhớ: tính tham gia ở chương 2 quyết định khóa ngoại có được rỗng không.", "emphasis": [3], "objective": "Nối tính tham gia của chương 2 với ràng buộc của chương 3.", "notes": "Đây là mối nối quan trọng giữa hai chương. Ở chương hai đã học rằng hai chiều của một liên kết có thể có tính tham gia khác nhau, và lúc ấy chưa thấy hệ quả. Hệ quả chính là ở đây: tham gia bắt buộc thành ràng buộc không rỗng, tham gia tùy chọn thì cho phép rỗng. Xác định sai ở chương hai thì ràng buộc ở đây cũng sai theo."}, {"layout": "reveal", "phase": "luyen-tap", "minutes": 3, "title": "Ví dụ: thao tác nào bị chặn", "prompt": "Ràng buộc nào chặn mỗi thao tác dưới đây, hoặc không chặn được?", "items": [{"q": "Thêm học viên mà để trống mã học viên", "a": "Toàn vẹn thực thể chặn. Khóa chính không được rỗng ở bất kỳ thành phần nào."}, {"q": "Ghi mã lớp là L99 trong khi bảng LOP không có L99", "a": "Toàn vẹn tham chiếu chặn. Khóa ngoại phải khớp một khóa chính đang tồn tại."}, {"q": "Nhập học phí là số âm", "a": "Không ràng buộc nào chặn. Đây là ràng buộc miền giá trị, thuộc phạm vi chương 4."}], "objective": "Phân biệt phạm vi của hai ràng buộc trên ba thao tác.", "notes": "Cho lớp trả lời thầm rồi mở đáp án. Câu thứ ba là câu quan trọng nhất vì nó dẫn thẳng sang slide sau về giới hạn của hai ràng buộc. Nhiều em sẽ nghĩ đã có ràng buộc thì mọi lỗi đều bị chặn, và đó là hiểu nhầm cần gỡ ngay."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 3, "title": "Ba lỗ hổng không chặn được", "left": {"heading": "Chỉ bảo vệ cấu trúc", "bullets": ["Học phí âm: ràng buộc miền giá trị", "Ngày khai giảng trước ngày thành lập", "Sĩ số vượt sức chứa của lớp"]}, "right": {"heading": "Vì sao không chặn được", "bullets": ["Hai ràng buộc chỉ quan tâm tới khóa", "Không biết gì về nghiệp vụ", "Có loại phải đếm mới biết"]}, "note": "Ba lỗ hổng này chính là lý do tồn tại của chương 4.", "emphasis": [5], "objective": "Thấy hai ràng buộc là điều kiện cần chứ chưa đủ.", "notes": "Đây là slide mở đường sang chương bốn. Hai ràng buộc vừa học rất mạnh nhưng chúng chỉ bảo vệ cấu trúc, tức là chuyện khóa. Mọi thứ thuộc về nghiệp vụ thì chúng không biết. Chương bốn sẽ xây một bộ sáu loại ràng buộc đủ phủ kín các tình huống ấy."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Đã có gì và câu hỏi tiếp theo", "bullets": ["Đã có: ngôn ngữ quan hệ và hai luật bảo vệ", "Câu hỏi tiếp: dịch lược đồ ER thành bảng ra sao", "Bốn quy tắc cho bốn thành phần cơ bản", "Rồi ba ca đặc biệt đã gặp ở chương 2"], "note": "Chặng 1 đã xong; sang phần trọng tâm của buổi.", "objective": "Khớp nối sang phần bốn quy tắc ánh xạ.", "notes": "Dừng lại ba mươi giây. Từ đây là phần được đề cương đánh dấu sao, tức là nội dung trọng tâm. Toàn bộ công việc sắp tới là dịch, và bảng từ điển phiên dịch đã xem ở buổi trước chính là bản đồ của việc dịch ấy."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "QT1: thực thể mạnh", "bullets": ["Mỗi thực thể mạnh thành một bảng", "Thuộc tính khóa trở thành khóa chính", "Các thuộc tính khác trở thành cột bình thường", "Đây là quy tắc dễ nhất, gần như chỉ đổi tên"], "note": "Bốn dòng đầu của bảng từ điển phiên dịch chính là quy tắc này.", "objective": "Nắm quy tắc ánh xạ đơn giản nhất.", "notes": "Quy tắc này dễ tới mức sinh viên hay bỏ qua, nhưng cần nói rõ vì nó là nền cho ba quy tắc sau. Thực thể mạnh là thực thể có khóa riêng đầy đủ, đã học ở chương hai. Slide sau xử lý một chi tiết nhỏ nhưng hay gặp là thuộc tính phức hợp."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "QT1: thuộc tính phức hợp", "bullets": ["Thuộc tính phức hợp tách thành các cột đơn", "Địa chỉ thành số nhà, đường, quận, tỉnh", "Mô hình quan hệ không có cột lồng cột", "Nếu không cần truy vấn theo phần thì giữ một cột cũng được"], "note": "Quyết định tách hay giữ đã cân nhắc từ chương 2, đây chỉ là ghi lại.", "emphasis": [2], "objective": "Biết cách ánh xạ thuộc tính phức hợp.", "notes": "Lý do phải tách nằm ở dòng thứ ba: mô hình quan hệ chỉ có bảng phẳng, không có khái niệm cột lồng trong cột. Nhưng quyết định tách hay giữ nguyên thì đã cân nhắc từ chương hai theo nhu cầu truy vấn, ở đây chỉ ghi lại kết quả."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "QT2: liên kết một một", "bullets": ["Đưa khóa chính của một bên sang bên kia làm khóa ngoại", "Không tạo bảng mới", "Chọn bên tham gia bắt buộc để đặt khóa ngoại", "Làm vậy để tránh cột đầy giá trị rỗng"], "note": "Ghi nhớ: đặt ở bên bắt buộc thì cột khóa ngoại không bị rỗng nhiều.", "emphasis": [2], "objective": "Nắm quy tắc và tiêu chí chọn bên đặt khóa ngoại.", "notes": "Với liên kết một một thì đặt khóa ngoại ở bên nào cũng đúng về mặt cấu trúc, nên cần một tiêu chí phụ để chọn. Tiêu chí ấy là tính tham gia: đặt ở bên bắt buộc thì mọi dòng đều có giá trị, còn đặt ở bên tùy chọn thì cột ấy đầy ô rỗng. Lại một lần nữa quyết định của chương hai chi phối chương ba."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "QT3: liên kết một nhiều", "bullets": ["Đưa khóa chính bên một sang bên nhiều làm khóa ngoại", "Không tạo bảng mới", "Đây là quy tắc hay bị áp sai nhất", "Nên đáng chứng minh thay vì chỉ ghi nhớ"], "note": "Slide sau làm sai có chủ ý để thấy vì sao không thể làm ngược lại.", "emphasis": [2], "objective": "Nắm quy tắc dùng nhiều nhất và báo trước phần chứng minh.", "notes": "Đây là quy tắc dùng nhiều nhất trong thực tế vì liên kết một nhiều chiếm đa số. Nó cũng là quy tắc hay bị áp ngược nhất. Thay vì bắt học thuộc, hai slide sau sẽ làm sai có chủ ý để cả lớp tự thấy vì sao không có cách nào khác."}, {"layout": "image-text", "phase": "hinh-thanh", "minutes": 4, "title": "Làm sai để thấy vì sao", "image": "hinh-ve/Chuong-3_Mo-hinh-quan-he_hinh04_ca280aa7.png", "caption": "Hình 1. Đặt khóa ngoại nhầm sang phía một thì ô phải chứa bốn giá trị", "source": "Nguồn: Bài giảng Cơ sở dữ liệu, Chương 3, Hình 3.4.", "bullets": ["Một người phụ trách bốn lớp A1, A2, A3, A4", "Đặt khóa ngoại ở phía người phụ trách thì ô phải chứa bốn mã lớp", "Vi phạm ngay đặc trưng mỗi ô một giá trị đơn"], "objective": "Thấy tận mắt vì sao đặt khóa ngoại sai bên là bất khả thi.", "notes": "Đây là hoạt động làm sai để thấy vì sao mà đề cương ghi rõ. Hãy dừng lâu ở hình này. Giả sử một người phụ trách bốn lớp, nếu đặt khóa ngoại ở phía người phụ trách thì dòng của người ấy phải chứa bốn mã lớp trong một ô. Không có cách nào khác, và điều đó vi phạm ngay đặc trưng thứ tư. Đặt ở phía lớp thì mỗi lớp chỉ có một người phụ trách nên mỗi ô chỉ một giá trị."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Chứng minh không dùng gì mới", "bullets": ["Khóa ngoại luôn đặt ở phía nhiều", "Vì phía một chỉ giữ nổi một giá trị trong mỗi ô", "Chứng minh trên chỉ dùng lại đặc trưng thứ tư", "Quy tắc suy ra từ nguyên lý nền, không học thuộc rời rạc"], "note": "Ghi nhớ: gánh nặng thiết lập liên kết đặt lên bảng chứa khóa ngoại.", "emphasis": [3], "objective": "Thấy phương pháp suy quy tắc từ nguyên lý nền.", "notes": "Dòng cuối cùng là bài học phương pháp quan trọng nhất của buổi. Chứng minh vừa rồi không dùng thêm kiến thức mới nào, nó chỉ dùng lại một đặc trưng đã học ở buổi trước. Đây là ví dụ điển hình cho cách các quy tắc thiết kế được suy ra từ vài nguyên lý nền tảng. Sinh viên nào hiểu được điều này thì không cần học thuộc bốn quy tắc nữa."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "QT4: liên kết nhiều nhiều", "bullets": ["Tạo một bảng mới, không đưa khóa ngoại sang bên nào cả", "Khóa chính là khóa phức hợp ghép khóa chính hai bên", "Cộng thêm các thuộc tính riêng của liên kết", "Hai thành phần khóa đồng thời là hai khóa ngoại"], "note": "Ở chương 2 việc này đã làm sẵn dưới tên gọi thực thể kết hợp.", "emphasis": [0], "objective": "Nắm quy tắc sinh bảng mới từ liên kết nhiều nhiều.", "notes": "Quy tắc này khác hẳn ba quy tắc trước vì nó sinh ra một bảng mới. Nhưng sinh viên đã quen với nó rồi: ở chương hai đã tách liên kết nhiều nhiều thành thực thể kết hợp, nên bước ánh xạ chỉ là ghi lại. Slide sau mới là phần trả nợ."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ví dụ: bảng GHIDANH sau ánh xạ", "bullets": ["GHIDANH gồm mã học viên, mã lớp, ngày ghi danh, học phí", "Khóa chính là cặp mã học viên và mã lớp", "Mã học viên đồng thời là khóa ngoại trỏ về HOCVIEN", "Mã lớp đồng thời là khóa ngoại trỏ về LOP"], "note": "Ghi nhớ: một cột có thể vừa là phần khóa chính vừa là khóa ngoại.", "emphasis": [3], "objective": "Thấy kết quả cụ thể của quy tắc bốn trên ví dụ quen thuộc.", "notes": "Bảng này chính là thực thể kết hợp đã tách ở chương hai, nay viết ra dưới dạng quan hệ đầy đủ. Điểm sinh viên hay bối rối nằm ở dòng ghi chú: một cột vừa là một phần của khóa chính vừa là khóa ngoại. Điều đó hoàn toàn hợp lệ và rất phổ biến ở các bảng trung gian."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Trả xong món nợ chương 2", "bullets": ["Chương 2 hứa: nhiều nhiều phải tách kể cả khi không có thuộc tính", "Nếu không tách thì phải đặt khóa ngoại ở một trong hai phía", "Mà cả hai phía đều nhiều, nên ô nào cũng chứa nhiều giá trị", "Không có chỗ nào đặt được, bảng trung gian là lối thoát duy nhất"], "note": "Ghi nhớ: lại vẫn chỉ dùng đặc trưng thứ tư để chứng minh.", "emphasis": [3], "objective": "Chứng minh dứt điểm món nợ đã hẹn từ chương 2.", "notes": "Đây là khoảnh khắc trả nợ. Ở chương hai chỉ nói rằng phải tách và hẹn sẽ chứng minh, nay chứng minh được. Lập luận rất gọn và lại vẫn chỉ dùng đặc trưng thứ tư. Hãy đi thật chậm ba dòng giữa và hỏi cả lớp thử tìm một cách khác, để tự thấy rằng không còn lựa chọn nào."}, {"layout": "quiz", "phase": "luyen-tap", "minutes": 3, "branch": true, "title": "Kiểm tra giữa bài", "question": "Liên kết một nhiều giữa KHOAHOC và LOP. Cột khóa ngoại đặt ở bảng nào?", "options": ["Bảng KHOAHOC, vì nó là bên một", "Bảng LOP, vì nó là bên nhiều", "Cả hai bảng để tiện truy vấn", "Tạo một bảng trung gian mới"], "answer": 1, "explain": "Khóa ngoại luôn đặt ở phía nhiều. Nếu đặt ở bảng khóa học thì một khóa mở nhiều lớp nên ô đó phải chứa nhiều mã lớp, vi phạm đặc trưng mỗi ô một giá trị đơn. Đặt ở bảng lớp thì mỗi lớp chỉ thuộc một khóa nên mỗi ô đúng một giá trị.", "objective": "Kiểm tra khả năng áp đúng quy tắc dùng nhiều nhất.", "notes": "Slide này bật rẽ nhánh nên mỗi phương án có trang phản hồi riêng. Phương án cuối cùng là bẫy dành cho ai nhớ máy móc rằng cứ liên kết thì tạo bảng, không phân biệt loại. Khi chữa, yêu cầu sinh viên nhắc lại lập luận chứ không chỉ nói đáp án."}, {"layout": "match", "phase": "luyen-tap", "minutes": 3, "title": "Ghép thành phần với kết quả", "prompt": "Mỗi thành phần ER dưới đây ánh xạ thành gì trong mô hình quan hệ?", "pairs": [{"left": "Thực thể mạnh với các thuộc tính của nó", "right": "Một bảng"}, {"left": "Liên kết một nhiều giữa hai thực thể", "right": "Một cột khóa ngoại"}, {"left": "Liên kết nhiều nhiều có thuộc tính riêng", "right": "Một bảng mới"}, {"left": "Thuộc tính phức hợp như địa chỉ", "right": "Nhiều cột đơn"}], "explain": "Mẹo nhớ: chỉ liên kết nhiều nhiều mới sinh bảng mới, còn một nhiều và một một chỉ sinh một cột. Lý do nằm ở chỗ phía nhiều có giữ nổi giá trị hay không, và điều đó quyết định bởi đặc trưng mỗi ô một giá trị đơn.", "objective": "Củng cố bốn quy tắc bằng thao tác ghép nối.", "notes": "Cho làm theo cặp trong hai phút. Cặp thứ hai và thứ ba là cặp cần đối chiếu với nhau: cùng là liên kết nhưng cho hai kết quả khác hẳn. Khi chữa, hãy hỏi lại vì sao khác nhau, và câu trả lời phải quay về đặc trưng thứ tư."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Chặng 3: ba ca còn lại", "bullets": ["Đã có: bốn quy tắc cho bốn thành phần cơ bản", "Câu hỏi tiếp: thực thể yếu ánh xạ thế nào", "Câu hỏi tiếp: liên kết đệ quy và phân cấp cha con", "Cả ba đều đã gặp ở chương 2, nay chỉ dịch sang bảng"], "note": "Chặng 2 đã xong; sang ba ca đặc biệt.", "objective": "Khớp nối sang phần ba ca đặc biệt.", "notes": "Dừng lại ba mươi giây. Ba ca sắp tới đều là ca đã học kỹ ở buổi ba chương hai, nên phần khó là nhận diện thì đã xong. Ở đây chỉ còn việc dịch, và mỗi ca chỉ mất vài phút."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Ánh xạ thực thể yếu", "bullets": ["Thực thể yếu trở thành một bảng riêng", "Khóa chính là khóa phức hợp gồm hai phần", "Phần một là khóa chính của thực thể chủ, cũng là khóa ngoại", "Phần hai là thuộc tính phân biệt riêng của thực thể yếu"], "note": "Ví dụ: DIENTHOAI có khóa chính là cặp mã học viên và số điện thoại.", "emphasis": [2], "objective": "Nắm cách ánh xạ thực thể yếu thành bảng.", "notes": "Điểm đặc biệt nằm ở dòng thứ ba: cùng một cột vừa là một phần của khóa chính vừa là khóa ngoại. Điều đó phản ánh đúng bản chất của thực thể yếu đã học ở chương hai, rằng nó phải mượn khóa của thực thể chủ mới đủ phân biệt."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ánh xạ đệ quy nhiều nhiều", "bullets": ["Áp đúng quy tắc bốn, tạo một bảng mới", "Khác biệt: hai khóa ngoại cùng trỏ về một bảng", "Nên phải đặt tên khác nhau để phân biệt vai trò", "Ví dụ TIENQUYET gồm mã khóa trước và mã khóa sau"], "note": "Lưu ý: quên đặt tên phân biệt là lỗi đã cảnh báo từ chương 2.", "emphasis": [2], "objective": "Ánh xạ liên kết đệ quy nhiều nhiều.", "notes": "Quy tắc không đổi, chỉ có một chi tiết kỹ thuật. Đây là lỗi đã cảnh báo ở chương hai và nay lặp lại vì nó thực sự hay gặp. Nếu hai cột cùng tên thì không phân biệt được chiều, và dữ liệu bị đảo mà không ai phát hiện."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ánh xạ đệ quy một nhiều", "bullets": ["Không cần bảng mới, chỉ thêm một cột", "Cột ấy là khóa ngoại trỏ về chính bảng đó", "Ví dụ NHANVIEN thêm cột mã người quản lý", "Cột mã người quản lý trỏ về mã nhân viên cùng bảng"], "note": "Ghi nhớ: đệ quy vẫn theo đúng quy tắc của loại liên kết tương ứng.", "emphasis": [1], "objective": "Ánh xạ liên kết đệ quy một nhiều.", "notes": "Ca này đơn giản hơn ca trước vì đệ quy một nhiều vẫn theo quy tắc ba, tức là chỉ thêm một cột. Điều thú vị là khóa ngoại trỏ về chính bảng chứa nó, nghe lạ nhưng hoàn toàn hợp lệ. Đây chính là cách cài đặt cây phân cấp trong cơ sở dữ liệu."}, {"layout": "reveal", "phase": "luyen-tap", "minutes": 3, "title": "Ví dụ: ánh xạ ba liên kết", "prompt": "Mỗi liên kết dưới đây cho ra cấu trúc gì?", "items": [{"q": "Một khoa có nhiều giảng đường, mỗi giảng đường thuộc một khoa", "a": "Một nhiều, nên thêm cột mã khoa vào bảng giảng đường làm khóa ngoại. Không có bảng mới."}, {"q": "Một sinh viên học nhiều môn, một môn có nhiều sinh viên", "a": "Nhiều nhiều, nên tạo bảng mới với khóa chính là cặp mã sinh viên và mã môn."}, {"q": "Mỗi phòng ban trực thuộc một phòng ban cấp trên", "a": "Đệ quy một nhiều, nên thêm một cột mã phòng ban cấp trên trỏ về chính bảng ấy."}], "objective": "Áp ba quy tắc khác nhau trên ba tình huống.", "notes": "Cho lớp trả lời thầm rồi mở đáp án. Ba câu này bao ba trường hợp hay gặp nhất trong bài tập. Câu thứ ba là câu dễ sai vì nhiều em nghĩ đệ quy thì phải tạo bảng mới, trong khi chỉ đệ quy nhiều nhiều mới cần."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Mô hình quan hệ không có kế thừa", "bullets": ["Chương 2 đã có quan hệ cha con và tính kế thừa", "Nhưng mô hình quan hệ không có khái niệm kế thừa", "Nên phân cấp phải được diễn đạt lại bằng bảng", "Có ba phương án, mỗi phương án hợp một tình huống"], "note": "Chọn phương án nào phụ thuộc trực tiếp vào hai ràng buộc đã xác định ở chương 2.", "emphasis": [1], "objective": "Hiểu vì sao phân cấp cần cách diễn đạt riêng.", "notes": "Đây là chỗ mô hình đích nghèo hơn mô hình nguồn. Mô hình ER mở rộng có khái niệm kế thừa, mô hình quan hệ thì không, nên phải tìm cách diễn đạt lại. Ba phương án sắp học không phải ba lựa chọn tùy thích mà mỗi phương án hợp một tình huống cụ thể."}, {"layout": "image-text", "phase": "hinh-thanh", "minutes": 3, "title": "Ba phương án ánh xạ phân cấp", "image": "hinh-ve/Chuong-3_Mo-hinh-quan-he_hinh05_91aa6e8a.png", "caption": "Hình 2. Ba cách diễn đạt một phân cấp cha con bằng bảng quan hệ", "source": "Nguồn: Bài giảng Cơ sở dữ liệu, Chương 3, Hình 3.5.", "bullets": ["Phương án 1: gộp tất cả vào một bảng duy nhất", "Phương án 2: mỗi con một bảng, bỏ bảng cha", "Phương án 3: giữ cả bảng cha lẫn các bảng con"], "objective": "Nhìn thấy ba phương án cùng lúc trước khi so sánh.", "notes": "Chiếu cả ba phương án cạnh nhau rồi mới đi vào từng cái. Phương án một chính là cách gộp chung mà chương hai đã chê là tồi, nhưng nó vẫn dùng được trong một trường hợp. Phương án ba là phương án tổng quát nhất. Ba slide sau sẽ so sánh và đưa tiêu chí chọn."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Phương án 1: gộp một bảng", "bullets": ["Một bảng chứa cả thuộc tính chung lẫn mọi thuộc tính riêng", "Thêm một cột phân loại để biết dòng đó thuộc nhóm nào", "Nhược điểm: nhiều ô rỗng, đúng như chương 2 đã chê", "Chỉ nên dùng khi các nhóm con có rất ít thuộc tính riêng"], "note": "Ghi nhớ: ít thuộc tính riêng thì vài ô rỗng còn rẻ hơn việc tách bảng.", "emphasis": [3], "objective": "Biết trường hợp duy nhất mà phương án gộp là hợp lý.", "notes": "Chương hai đã chê cách gộp chung, nhưng chê trong bối cảnh mỗi nhóm có nhiều thuộc tính riêng. Khi các nhóm chỉ khác nhau một hai thuộc tính thì chấp nhận vài ô rỗng lại rẻ hơn việc tách bảng rồi phải kết. Đây là ví dụ cho thấy không có phương án nào luôn đúng."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 3, "title": "Phương án 2 và phương án 3", "left": {"heading": "Phương án 2: bỏ bảng cha", "bullets": ["Mỗi con một bảng, chứa cả phần chung", "Không có ô rỗng nào", "Nhưng lặp lại thuộc tính chung ở mọi bảng"]}, "right": {"heading": "Phương án 3: giữ cả hai tầng", "bullets": ["Cha chứa phần chung, con chứa phần riêng", "Khóa chính của con cũng là khóa ngoại về cha", "Muốn đủ thông tin thì phải kết hai bảng"]}, "note": "Phương án 3 là phương án tổng quát nhất, xử lý được mọi ràng buộc.", "emphasis": [5], "objective": "So sánh hai phương án còn lại trên ba tiêu chí.", "notes": "Phương án hai chỉ dùng được khi ràng buộc là rời nhau và đầy đủ, vì nếu chồng lấn thì người kiêm nhiệm bị lưu hai lần, còn nếu không đầy đủ thì có người không bảng nào chứa. Phương án ba xử lý được cả hai tình huống ấy nên tổng quát nhất, đổi lại phải kết bảng khi truy vấn."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 3, "title": "Hai ràng buộc quyết định phương án", "bullets": ["Rời nhau và đầy đủ thì dùng được phương án 2 hoặc 3", "Rời nhau nhưng không đầy đủ thì phải dùng phương án 3", "Chồng lấn thì bắt buộc phương án 3, dù đầy đủ hay không", "Con có rất ít thuộc tính riêng thì phương án 1"], "note": "Ghi nhớ: hai câu hỏi hỏi khách hàng ở chương 2 quyết định cấu trúc bảng ở đây.", "emphasis": [3], "objective": "Có bảng tra để chọn phương án theo ràng buộc.", "notes": "Bảng tra này cho thấy vì sao mục hai ràng buộc ở chương hai lại quan trọng đến thế. Nếu người thiết kế không hỏi khách hàng có ai kiêm nhiệm không và có ai không thuộc nhóm nào không, thì tới đây sẽ chọn phương án theo cảm tính. Chọn sai thì hoặc mất dữ liệu, hoặc trùng lặp dữ liệu."}, {"layout": "practice", "phase": "luyen-tap", "minutes": 6, "title": "Bài tập tại lớp: ánh xạ lược đồ", "duration": "6 phút", "form": "Nhóm 2 người", "weight": "Điểm chuyên cần", "requirements": ["Cho lược đồ ER gồm KHOA, NHANSU, MONHOC và liên kết dạy", "Áp bốn quy tắc để viết ra tập quan hệ đầy đủ", "Chỉ rõ khóa chính, khóa ngoại và cột nào không được rỗng"], "criteria": ["Đặt khóa ngoại đúng phía và giải thích được vì sao", "Nêu được  tắc cơ học, dòng cuối là dòng đòi hỏi quay lại hỏi khách hàng. Hãy nhấn mạnh rằng dòng cuối mới là dòng phân biệt người thiết kế với người chép quy tắc."}, {"layout": "quiz", "phase": "cung-co", "minutes": 3, "title": "Quiz cuối buổi", "question": "Vì sao liên kết nhiều nhiều không thể ánh xạ bằng cách thêm một cột khóa ngoại?", "options": ["Vì quy tắc bốn cấm làm như vậy", "Vì cả hai phía đều nhiều nên ô nào cũng phải chứa nhiều giá trị", "Vì bảng sẽ có quá nhiều cột", "Vì hệ quản trị không cho phép"], "answer": 1, "explain": "Đặt khóa ngoại ở phía nào cũng hỏng vì phía nào cũng là nhiều, nên ô đó phải chứa nhiều giá trị và vi phạm đặc trưng mỗi ô một giá trị đơn. Không có chỗ nào đặt được, nên bảng trung gian là lối thoát duy nhất. Đây là chứng minh chứ không phải quy ước.", "objective": "Đo mức hiểu chứng minh thay vì ghi nhớ quy tắc.", "notes": "Đây là câu chốt và cũng là câu phân biệt người hiểu với người thuộc. Phương án đầu tiên là bẫy dành cho ai coi quy tắc là mệnh lệnh phải tuân theo. Hãy nhấn mạnh rằng quy tắc bốn không phải nguyên nhân mà là hệ quả; nguyên nhân là đặc trưng thứ tư."}, {"layout": "bullets", "phase": "cung-co", "minutes": 2, "role": "summary", "title": "Tóm tắt buổi 2", "bullets": ["Toàn vẹn thực thể: khóa chính duy nhất và không rỗng", "Toàn vẹn tham chiếu: khóa ngoại hoặc rỗng hoặc trỏ đúng", "Khóa ngoại luôn đặt ở phía nhiều, nhiều nhiều thì tạo bảng mới", "Hai ràng buộc phân cấp quyết định chọn phương án nào"], "note": "Đối chiếu lại bốn dòng này với slide mục tiêu ở đầu buổi.", "emphasis": [2], "objective": "Hệ thống hóa buổi học thành bốn điểm ghi nhớ.", "notes": "Bốn dòng này gói lại toàn bộ buổi học. Nếu chỉ nhớ được một dòng thì hãy nhớ dòng thứ ba, vì nó là kỹ năng dùng nhiều nhất và cũng vì nó suy ra được từ đặc trưng thứ tư chứ không phải học thuộc. Quay lại slide mục tiêu và để mỗi người tự chấm."}, {"layout": "bullets", "phase": "cung-co", "minutes": 2, "title": "Nối sang buổi 3", "bullets": ["Đã có: tập bảng đầy đủ với khóa và ràng buộc", "Còn thiếu: cách lấy dữ liệu ra khỏi các bảng ấy", "Buổi sau học đại số quan hệ, bắt đầu bằng chọn và chiếu", "Rồi các phép toán tập hợp và điều kiện khả hợp"], "note": "Đại số quan hệ là nền tảng toán học của mọi câu truy vấn.", "emphasis": [2], "objective": "Tạo nhu cầu học tiếp bằng câu hỏi lấy dữ liệu ra.", "notes": "Slide này nối buổi hai sang buổi ba. Tới giờ đã biết cách cất dữ liệu vào đâu, nhưng chưa biết cách lấy ra. Đại số quan hệ là nền tảng toán học của mọi câu truy vấn, và nó cũng chính là phần cho thấy mô hình quan hệ có tính đóng kín, tức là kết quả của một phép toán lại là một bảng."}, {"layout": "bullets", "phase": "cung-co", "minutes": 2, "role": "homework", "title": "Bài tập về nhà", "bullets": ["Đọc trước mục 3.5 và 3.6 trong giáo trình chương 3", "Ánh xạ lược đồ ER của tổ chức mình thành tập quan hệ", "Ghi rõ khóa chính, khóa ngoại và cột nào cấm rỗng", "Mở rộng: nếu có phân cấp thì chọn phương án và giải thích"], "note": "Nộp qua hệ thống học tập trực tuyến trước buổi học kế tiếp.", "objective": "Chuyển sản phẩm chương 2 sang dạng tập quan hệ.", "notes": "Nhiệm vụ thứ hai là bước chuyển quan trọng: lược đồ ER mà mỗi em đã dựng suốt chương hai nay được dịch thành tập bảng thật. Đây cũng là đầu vào cho các buổi sau và cho chương bốn, nên nhắc cả lớp làm cẩn thận và giữ lại."}], "_phase": {"khoi-dong": "Khởi động", "hinh-thanh": "Hình thành kiến thức", "luyen-tap": "Luyện tập", "van-dung": "Vận dụng", "cung-co": "Củng cố & đánh giá"}, "_objvn": {"knowledge": "Kiến thức", "skill": "Kỹ năng", "attitude": "Thái độ / Năng lực"}, "_order": {"23": [3, 2, 1, 0]}};</script>
<script>
/* Runtime bản HTML tương tác. build_html.py nhúng SPEC vào trang trước khi file này chạy.
   Không phụ thuộc thư viện ngoài. */
(function () {
  "use strict";
  var S = window.SPEC, meta = S.meta || {}, stage = document.getElementById("stage");
  var PHASE = S._phase || {};
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  var el = function (h) { var d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
  var K = "ABCDEFGH".split("");

  var slides = (S.slides || []).slice();
  slides.push({ layout: "results", title: "Kết quả luyện tập", phase: "cung-co", minutes: 0 });

  /* mốc thời gian cộng dồn */
  var marks = [], acc = 0;
  slides.forEach(function (s) {
    var m = +(s.minutes || 0);
    marks.push({ from: acc, to: acc + m, m: m });
    acc += m;
  });
  var planTotal = acc;
  var graded = [];
  var cur = 0;

  function head(s, i) {
    /* Thời lượng không hiện trên slide — xem ở panel Kịch bản (N) và Tổng quan (O). */
    return '<div class="hd"><h2>' + esc(s.title || "") + "</h2>" +
      '</div><div class="rule"></div>';
  }
  function foot(i) {
    var l = meta.footer || [meta.course, meta.title].filter(Boolean).join("  ·  ");
    return '<div class="ft"><span>' + esc(l) + "</span><span>" + (i + 1) + "</span></div>";
  }
  function note(t) { return t ? '<div class="note">' + esc(t) + "</div>" : ""; }
  function bullets(list) {
    return (list || []).map(function (b) {
      return '<div class="pt"><div class="d"></div><span>' + esc(b) + "</span></div>";
    }).join("");
  }

  var R = {};

  R.title = function (s, i) {
    var tpl = !!meta.school;   /* chế độ theo mẫu slide của Trường */
    var top = tpl ? [meta.school, meta.faculty].filter(Boolean).join("  ·  ")
                  : [meta.course, meta.audience].filter(Boolean).join("  ·  ");
    var info = [meta.lecturer ? "Giảng viên: " + meta.lecturer : null, meta.date]
      .filter(Boolean).join("  ·  ");
    var t = tpl ? String(s.title).toUpperCase() : s.title;
    var sub = (tpl && meta.course) ? meta.course : s.subtitle;
    var sub2 = (tpl && meta.course && s.subtitle)
      ? '<div class="who">' + esc(s.subtitle) + "</div>" : "";
    return '<div class="slide title edge">' +
      (S._logo ? '<img class="tlogo" src="' + S._logo + '" alt="logo">' : "") +
      '<div class="org">' + esc(top.toUpperCase()) + "</div>" +
      "<h1>" + esc(t) + '</h1><div class="bar"></div>' +
      '<div class="sub">' + esc(sub) + "</div>" + sub2 +
      '<div class="who">' + esc(info) + "</div>" + foot(i) + "</div>";
  };

  R.objectives = function (s, i) {
    var rows = (meta.objectives || []).map(function (o, n) {
      var tag = (S._objvn[o.type] || o.type || "") + (o.bloom ? " · " + o.bloom : "");
      return '<div class="goal"><div class="n">' + ("0" + (n + 1)).slice(-2) + "</div>" +
        '<div class="tx"><b>' + esc(o.text) + "</b>" +
        (o.detail ? "<span>" + esc(o.detail) + "</span>" : "") + "</div>" +
        '<div class="tag">' + esc(tag) + "</div></div>";
    }).join("");
    return '<div class="slide">' + head(s, i) +
      '<div class="body"><p class="lead">Sau bài học này, sinh viên có khả năng:</p>' +
      rows + "</div>" + foot(i) + "</div>";
  };

  R.bullets = function (s, i) {
    return '<div class="slide">' + head(s, i) + '<div class="body">' +
      bullets(s.bullets) + note(s.note) + "</div>" + foot(i) + "</div>";
  };

  R["two-column"] = function (s, i) {
    function pan(c) {
      return '<div class="panel"><div class="ph">' + esc(c.heading || "") +
        '</div><div class="pb">' + bullets(c.bullets) + "</div></div>";
    }
    return '<div class="slide">' + head(s, i) + '<div class="body"><div class="cols">' +
      pan(s.left || {}) + pan(s.right || {}) + "</div>" + note(s.note) + "</div>" + foot(i) + "</div>";
  };

  R["image-text"] = function (s, i) {
    var fig = s.image
      ? '<img src="' + esc(s.image) + '" alt="' + esc(s.caption) + '">'
      : '<div class="figbox">[cần bổ sung hình minh họa]</div>';
    var left = '<div class="fig">' + fig + '<div class="cap">' + esc(s.caption) + "</div>" +
      (s.source ? '<div class="src">' + esc(s.source) + "</div>" : "") + "</div>";
    if (s.bullets && s.bullets.length) {
      return '<div class="slide">' + head(s, i) + '<div class="body"><div class="figsplit">' +
        left + '<div><div class="subhead">Ý CHÍNH</div><div class="ul"></div>' +
        bullets(s.bullets) + "</div></div></div>" + foot(i) + "</div>";
    }
    return '<div class="slide">' + head(s, i) + '<div class="body">' + left + "</div>" + foot(i) + "</div>";
  };

  R.diagram = function (s, i) {
    var n = s.steps.length;
    var cells = s.steps.map(function (st, k) {
      return '<div class="st"><div class="n">' + (k + 1) + "</div><b>" + esc(st.label) + "</b>" +
        (st.desc ? "<span>" + esc(st.desc) + "</span>" : "") + "</div>" +
        (k < n - 1 ? '<div class="ar">›</div>' : "");
    }).join("");
    return '<div class="slide">' + head(s, i) + '<div class="body"><div class="flow">' + cells +
      "</div>" + note(s.note) + "</div>" + foot(i) + "</div>";
  };

  R.question = function (s, i) {
    var pr = (s.prompts || []).map(function (p, k) {
      return '<div class="pt"><div class="d"></div><span>' + K[k] + ". " + esc(p) + "</span></div>";
    }).join("");
    return '<div class="slide">' + head(s, i) + '<div class="body">' +
      '<div class="q">' + esc(s.question) + "</div>" + pr +
      '<textarea class="ta" placeholder="Ghi ý kiến của nhóm tại đây (lưu trong trình duyệt)…"></textarea>' +
      note(s.note) + "</div>" + foot(i) + "</div>";
  };

  R.quiz = function (s, i) {
    var opts = s.options.map(function (o, n) {
      return '<button class="opt" data-n="' + n + '"><span class="k">' + K[n] + "</span><span>" +
        esc(o) + "</span></button>";
    }).join("");
    return '<div class="slide" data-graded="1">' + head(s, i) + '<div class="body">' +
      '<div class="q">' + esc(s.question) + "</div>" +
      '<div class="opts">' + opts + "</div>" +
      '<div class="row"><button class="btn js-check">Kiểm tra</button>' +
      '<button class="btn ghost js-reset">Làm lại</button></div><div class="fb"></div>' +
      "</div>" + foot(i) + "</div>";
  };

  R.reveal = function (s, i) {
    var rows = s.items.map(function (it, n) {
      return '<div class="rv" data-n="' + n + '"><span class="h">nhấp để xem</span><b>' +
        (n + 1) + ". " + esc(it.q) + '</b><div class="a">' + esc(it.a) + "</div></div>";
    }).join("");
    return '<div class="slide">' + head(s, i) + '<div class="body">' +
      (s.prompt ? '<p class="lead">' + esc(s.prompt) + "</p>" : "") + rows +
      '<div class="row"><button class="btn ghost js-all">Hiện tất cả</button></div>' +
      "</div>" + foot(i) + "</div>";
  };

  R.match = function (s, i) {
    var p = s.pairs, ord = S._order[i] || p.map(function (_, k) { return k; });
    var slots = p.map(function (x, n) {
      return '<div class="slotrow"><div class="lb">' + (n + 1) + ". " + esc(x.left) +
        '</div><div class="slot" data-n="' + n + '">thả vào đây</div></div>';
    }).join("");
    var toks = ord.map(function (n) {
      return '<div class="tok" draggable="true" data-n="' + n + '">' + esc(p[n].right) + "</div>";
    }).join("");
    return '<div class="slide" data-graded="1">' + head(s, i) + '<div class="body">' +
      (s.prompt ? '<p class="lead">' + esc(s.prompt) + "</p>" : "") +
      '<div class="match"><div>' + slots + '</div><div class="bank">' + toks + "</div></div>" +
      '<div class="row"><button class="btn js-check">Kiểm tra</button>' +
      '<button class="btn ghost js-reset">Làm lại</button></div><div class="fb"></div>' +
      "</div>" + foot(i) + "</div>";
  };

  R.practice = function (s, i) {
    var chips = [s.duration ? "Thời lượng: " + s.duration : "", s.form ? "Hình thức: " + s.form : "",
    s.weight ? "Trọng số: " + s.weight : ""].filter(Boolean)
      .map(function (c) { return '<div class="c">' + esc(c) + "</div>"; }).join("");
    var reqs = s.requirements.map(function (r, n) {
      return '<label class="task"><input type="checkbox" data-n="' + n + '"><span>Bước ' +
        (n + 1) + ". " + esc(r) + "</span></label>";
    }).join("");
    var side = "";
    if (s.criteria && s.criteria.length) {
      side += '<div class="box"><h4>TIÊU CHÍ ĐÁNH GIÁ</h4>' +
        s.criteria.map(function (c) { return '<div class="task"><span>• ' + esc(c) + "</span></div>"; }).join("") +
        "</div>";
    }
    if (s.hints && s.hints.length) {
      side += '<div class="box"><h4>GỢI Ý</h4>' +
        s.hints.map(function (h) { return '<div class="task"><span>• ' + esc(h) + "</span></div>"; }).join("") +
        "</div>";
    }
    return '<div class="slide">' + head(s, i) + '<div class="body"><div class="chips">' + chips + "</div>" +
      '<div class="box"><h4>YÊU CẦU — nhấp để đánh dấu đã xong</h4>' + reqs + "</div>" +
      (side ? '<div class="two">' + side + "</div>" : "") + "</div>" + foot(i) + "</div>";
  };

  R.results = function (s, i) {
    return '<div class="slide" data-results="1">' + head(s, i) +
      '<div class="body"><div class="score"><div class="big js-big">–</div>' +
      '<div class="lab">câu trả lời đúng</div><div class="rows js-rows"></div></div></div>' +
      foot(i) + "</div>";
  };

  /* ---------- dựng DOM ---------- */
  slides.forEach(function (s, i) {
    var fn = R[s.layout];
    if (!fn) { console.warn("chưa hỗ trợ:", s.layout); return; }
    var node = el(fn(s, i));
    node.dataset.idx = i;
    stage.appendChild(node);
    if (node.dataset.graded) graded.push({ i: i, title: s.title, state: null });
  });
  var nodes = [].slice.call(stage.querySelectorAll(".slide"));
  function mark(i, ok) { graded.forEach(function (g) { if (g.i === i) g.state = ok; }); }

  /* ---------- tương tác ---------- */
  nodes.forEach(function (node) {
    var i = +node.dataset.idx, s = slides[i];

    if (s.layout === "quiz") {
      var pick = null, opts = node.querySelectorAll(".opt"), fb = node.querySelector(".fb");
      opts.forEach(function (o) {
        o.addEventListener("click", function () {
          if (o.classList.contains("lock")) return;
          pick = +o.dataset.n;
          opts.forEach(function (x) { x.classList.remove("pick"); });
          o.classList.add("pick");
        });
      });
      node.querySelector(".js-check").addEventListener("click", function () {
        if (pick === null) return;
        var ok = pick === s.answer;
        opts.forEach(function (o) {
          var n = +o.dataset.n;
          o.classList.add("lock"); o.classList.remove("pick");
          if (n === s.answer) o.classList.add("right");
          else if (n === pick) o.classList.add("wrong");
        });
        fb.className = "fb on " + (ok ? "good" : "bad");
        fb.innerHTML = "<b>" + (ok ? "Chính xác." : "Chưa đúng.") + "</b>" + esc(s.explain);
        mark(i, ok);
      });
      node.querySelector(".js-reset").addEventListener("click", function () {
        pick = null;
        opts.forEach(function (o) { o.className = "opt"; });
        fb.className = "fb"; mark(i, null);
      });
    }

    if (s.layout === "reveal") {
      node.querySelectorAll(".rv").forEach(function (r) {
        r.addEventListener("click", function () { r.classList.toggle("open"); });
      });
      node.querySelector(".js-all").addEventListener("click", function () {
        node.querySelectorAll(".rv").forEach(function (r) { r.classList.add("open"); });
      });
    }

    if (s.layout === "match") {
      var sel = null, fb2 = node.querySelector(".fb");
      var toks = node.querySelectorAll(".tok"), slots = node.querySelectorAll(".slot");
      function place(slot, n) {
        if (slot.dataset.tok) {
          var old = node.querySelector('.tok[data-n="' + slot.dataset.tok + '"]');
          if (old) old.classList.remove("used");
        }
        slot.dataset.tok = n;
        slot.textContent = s.pairs[n].right;
        slot.className = "slot fill";
        var t = node.querySelector('.tok[data-n="' + n + '"]');
        if (t) { t.classList.add("used"); t.classList.remove("sel"); }
        sel = null;
      }
      toks.forEach(function (t) {
        t.addEventListener("click", function () {
          if (sel === t) { t.classList.remove("sel"); sel = null; return; }
          toks.forEach(function (x) { x.classList.remove("sel"); });
          t.classList.add("sel"); sel = t;
        });
        t.addEventListener("dragstart", function (e) { e.dataTransfer.setData("text/plain", t.dataset.n); });
      });
      slots.forEach(function (sl) {
        sl.addEventListener("click", function () {
          if (sel) place(sl, sel.dataset.n);
          else if (sl.dataset.tok) {
            var old = node.querySelector('.tok[data-n="' + sl.dataset.tok + '"]');
            if (old) old.classList.remove("used");
            delete sl.dataset.tok; sl.textContent = "thả vào đây"; sl.className = "slot";
          }
        });
        sl.addEventListener("dragover", function (e) { e.preventDefault(); sl.classList.add("over"); });
        sl.addEventListener("dragleave", function () { sl.classList.remove("over"); });
        sl.addEventListener("drop", function (e) {
          e.preventDefault(); sl.classList.remove("over");
          place(sl, e.dataTransfer.getData("text/plain"));
        });
      });
      node.querySelector(".js-check").addEventListener("click", function () {
        var all = true, done = 0;
        slots.forEach(function (sl) {
          if (!sl.dataset.tok) { all = false; return; }
          done++;
          var ok = +sl.dataset.tok === +sl.dataset.n;
          sl.className = "slot fill " + (ok ? "right" : "wrong");
          if (!ok) all = false;
        });
        if (done < slots.length) {
          fb2.className = "fb on bad";
          fb2.innerHTML = "<b>Chưa ghép đủ.</b>Hãy ghép hết các cặp rồi kiểm tra lại.";
          return;
        }
        fb2.className = "fb on " + (all ? "good" : "bad");
        fb2.innerHTML = "<b>" + (all ? "Ghép đúng toàn bộ." : "Còn cặp ghép sai.") + "</b>" + esc(s.explain);
        mark(i, all);
      });
      node.querySelector(".js-reset").addEventListener("click", function () {
        slots.forEach(function (sl) { delete sl.dataset.tok; sl.textContent = "thả vào đây"; sl.className = "slot"; });
        toks.forEach(function (t) { t.classList.remove("used", "sel"); });
        sel = null; fb2.className = "fb"; mark(i, null);
      });
    }

    if (s.layout === "question") {
      var ta = node.querySelector(".ta"), key = "ls-" + (meta.title || "") + "-" + i;
      try { ta.value = localStorage.getItem(key) || ""; } catch (e) { }
      ta.addEventListener("input", function () { try { localStorage.setItem(key, ta.value); } catch (e) { } });
    }

    if (s.layout === "practice") {
      node.querySelectorAll(".task input").forEach(function (c) {
        c.addEventListener("change", function () { c.closest(".task").classList.toggle("done", c.checked); });
      });
    }
  });

  function fillResults() {
    var n = stage.querySelector('[data-results="1"]');
    if (!n) return;
    var ok = graded.filter(function (g) { return g.state === true; }).length;
    n.querySelector(".js-big").textContent = ok + "/" + graded.length;
    n.querySelector(".js-rows").innerHTML = graded.map(function (g) {
      var c = g.state === true ? "ok" : g.state === false ? "no" : "na";
      var m = g.state === true ? "✓" : g.state === false ? "✕" : "–";
      return '<div class="r"><span class="s ' + c + '">' + m + "</span><span>" + esc(g.title) + "</span></div>";
    }).join("") || '<div class="r"><span>Bài giảng này chưa có câu hỏi chấm điểm.</span></div>';
  }

  /* ---------- điều hướng ---------- */
  var bar = document.getElementById("bar"), pos = document.getElementById("pos");
  var notes = document.getElementById("notes"), grid = document.getElementById("grid");

  function show(n) {
    cur = Math.max(0, Math.min(nodes.length - 1, n));
    nodes.forEach(function (x, k) { x.classList.toggle("on", k === cur); });
    bar.style.width = ((cur + 1) / nodes.length * 100) + "%";
    pos.textContent = (cur + 1) + " / " + nodes.length;
    var s = slides[cur] || {}, mk = marks[cur] || { m: 0 };
    notes.innerHTML = "<h5>Kịch bản giảng viên" +
      (s.phase ? " · " + esc(PHASE[s.phase] || s.phase) : "") +
      (mk.m ? " · " + mk.m + " phút (mốc " + mk.from + "→" + mk.to + " / " + planTotal + ")" : "") +
      "</h5>" + (s.notes ? esc(s.notes) : "<em style='opacity:.5'>(slide tổng hợp, không có kịch bản)</em>");
    if (s.layout === "results") fillResults();
    if (location.hash !== "#" + (cur + 1)) history.replaceState(null, "", "#" + (cur + 1));
    grid.querySelectorAll(".g").forEach(function (g, k) { g.classList.toggle("cur", k === cur); });
  }

  grid.innerHTML = slides.map(function (s, k) {
    return '<div class="g" data-k="' + k + '"><div class="gi">' + (k + 1) +
      (marks[k].m ? '<span class="gm">' + marks[k].m + "′</span>" : "") +
      '</div><div class="gt">' + esc(s.title || s.layout) + '</div><div class="gp">' +
      esc(PHASE[s.phase] || "") + "</div></div>";
  }).join("");
  grid.querySelectorAll(".g").forEach(function (g) {
    g.addEventListener("click", function () { show(+g.dataset.k); grid.classList.remove("on"); });
  });

  function fit() {
    document.documentElement.style.setProperty("--scale",
      Math.min(innerWidth / 1280, innerHeight / 720) *
      (document.body.classList.contains("shot") ? 1 : 0.96));
  }
  addEventListener("resize", fit);

  /* đồng hồ tiết dạy */
  var clock = document.getElementById("clock"), t0 = 0, held = 0, run = false;
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function elapsed() { return run ? held + Math.floor((Date.now() - t0) / 1000) : held; }
  function tick() {
    var e = elapsed(), mk = marks[cur] || { to: 0 };
    clock.textContent = two(Math.floor(e / 60)) + ":" + two(e % 60) + " / " + mk.to + "′";
    clock.className = (run ? "run" : "") + (mk.to && e > mk.to * 60 ? " over" : "");
  }
  function toggle() {
    if (run) { held = elapsed(); run = false; } else { t0 = Date.now(); run = true; }
    tick();
  }
  setInterval(tick, 500); tick();
  clock.addEventListener("click", toggle);

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "t" || e.key === "T") return toggle();
    if (e.key === "r" || e.key === "R") { held = 0; t0 = Date.now(); return tick(); }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { show(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { show(cur - 1); e.preventDefault(); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(nodes.length - 1);
    else if (e.key === "n" || e.key === "N") notes.classList.toggle("on");
    else if (e.key === "o" || e.key === "O" || e.key === "Escape") grid.classList.toggle("on");
  });
  document.getElementById("prev").addEventListener("click", function () { show(cur - 1); });
  document.getElementById("next").addEventListener("click", function () { show(cur + 1); });
  document.getElementById("tn").addEventListener("click", function () { notes.classList.toggle("on"); });
  document.getElementById("tg").addEventListener("click", function () { grid.classList.toggle("on"); });

  if (new URLSearchParams(location.search).get("shot") === "1") document.body.classList.add("shot");
  fit();
  show(Math.max(0, (parseInt(location.hash.replace("#", ""), 10) || 1) - 1));

  window.__deck = {
    show: show, count: nodes.length, graded: graded, slides: slides, marks: marks,
    planTotal: planTotal, ready: true,
    node: function (i) { return nodes[i]; }, cur: function () { return cur; },
    clock: function () { tick(); return { text: clock.textContent, cls: clock.className, sec: elapsed() }; }
  };
})();

</script>
</body>
</html>
