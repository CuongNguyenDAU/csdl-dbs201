<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô hình thực thể – liên kết</title>
<style>
/* Bản HTML tương tác — cùng hệ màu với bản .pptx (mẫu DAU).
   Sân khấu logic 1280x720 (13.333x7.5in @96dpi), scale theo cửa sổ. 1pt = 1.3333px */
:root {
  --brand:#A63A3A; --deep:#7E2B2B; --tint:#F6EEEC; --tintline:#E6D3D0;
  --card:#FBFAF9; --line:#E5E2DF; --ink:#1F1F22; --ink2:#4A4A50; --ink3:#7A7674;
  --ok:#1E7A4B; --okbg:#EAF6EF; --bad:#B3261E; --badbg:#FCEEED;
  --font:Arial,"Segoe UI",Helvetica,sans-serif; --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2A2A2E;font-family:var(--font);color:var(--ink);overflow:hidden}

#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;background:#fff;position:relative;
  transform:scale(var(--scale));transform-origin:center;box-shadow:0 18px 60px rgba(0,0,0,.45);overflow:hidden}

.slide:not(.on){display:none!important}
.slide{position:absolute;inset:0;padding:40px 86px 0}
.slide.on{display:block}

/* ---- khung chung ---- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:24px}
.hd h2{font-size:37px;font-weight:700;margin:0;line-height:1.15}
.chip{flex:0 0 auto;background:var(--tint);color:var(--deep);font-size:17px;font-weight:700;
  padding:7px 15px;border-radius:18px;white-space:nowrap}
.rule{position:relative;height:1px;background:var(--line);margin-top:16px}
.rule::before{content:"";position:absolute;left:0;top:-2px;width:110px;height:4px;background:var(--brand)}
.body{padding-top:22px}
.ft{position:absolute;left:86px;right:86px;bottom:24px;display:flex;justify-content:space-between;
  font-size:12px;color:var(--ink3)}
.lead{font-size:20px;color:var(--ink3);margin:0 0 14px}
.note{position:relative;background:var(--tint);border-radius:6px;padding:13px 18px 13px 22px;
  font-size:20px;color:var(--ink2);margin-top:18px}
.note::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;background:var(--brand);border-radius:3px 0 0 3px}

/* ---- title / edge ---- */
.edge::before{content:"";position:absolute;left:0;top:0;width:19px;height:100%;background:var(--brand)}
.edge::after{content:"";position:absolute;left:19px;top:0;width:4px;height:100%;background:var(--tint)}
.slide.title{display:flex;flex-direction:column;justify-content:center;padding:0 86px 0 120px}
.title .tlogo{width:96px;height:96px;object-fit:contain;background:#fff;
  border:1px solid var(--tintline,#E6D3D0);padding:10px;margin-bottom:22px}
.title .org{font-size:16px;font-weight:700;color:var(--brand);letter-spacing:.6px}
.title h1{font-size:48px;font-weight:700;margin:14px 0 0;line-height:1.15}
.title .bar{width:163px;height:6px;background:var(--brand);margin:22px 0 20px}
.title .sub{font-size:32px;color:var(--ink2)}
.title .who{border-left:3px solid var(--tintline);padding-left:16px;margin-top:30px;font-size:20px;color:var(--ink3)}

/* ---- objectives ---- */
.goal{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:8px;padding:12px 20px;margin-bottom:10px}
.goal .n{flex:0 0 42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:700}
.goal .tx b{font-size:24px;display:block}
.goal .tx span{font-size:19px;color:var(--ink2)}
.goal .tag{margin-left:auto;flex:0 0 auto;color:var(--deep);font-size:15px;font-weight:700;white-space:nowrap}

/* ---- bullets ---- */
.pt{display:flex;gap:16px;margin-bottom:16px}
.pt .d{flex:0 0 10px;height:10px;border-radius:2px;background:var(--brand);margin-top:11px}
.pt span{font-size:27px;line-height:1.3}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:42px}
.panel{background:var(--card);border-radius:8px;overflow:hidden}
.panel .ph{background:var(--tint);border-bottom:2px solid var(--tintline);padding:14px 22px;
  font-size:21px;font-weight:700;color:var(--deep);text-transform:uppercase;letter-spacing:.6px}
.panel .pb{padding:16px 22px}
.panel .pt span{font-size:24px}

/* ---- image-text ---- */
.figsplit{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start}
.fig img{max-width:100%;max-height:370px;border:1px solid var(--line);border-radius:6px}
.figbox{width:100%;height:340px;background:var(--card);border:1px dashed var(--tintline);
  border-radius:6px;display:grid;place-items:center;color:var(--ink3);font-size:20px}
.cap{font-size:20px;color:var(--ink2);margin-top:12px}
.src{font-size:16px;color:var(--ink3);margin-top:4px}
.subhead{font-size:20px;font-weight:700;color:var(--deep);letter-spacing:.8px}
.subhead+.ul{width:72px;height:4px;background:var(--tintline);margin:8px 0 18px}

/* ---- diagram ---- */
.flow{display:flex;align-items:stretch;gap:14px;margin-top:26px}
.flow .st{flex:1;background:var(--card);border-radius:8px;border-top:5px solid var(--brand);
  padding:18px 16px;text-align:center}
.flow .st .n{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:700;margin:0 auto 12px}
.flow .st b{font-size:24px;display:block;margin-bottom:8px}
.flow .st span{font-size:19px;color:var(--ink3)}
.flow .ar{align-self:center;color:var(--tintline);font-size:34px;font-weight:700}

/* ---- question / quiz ---- */
.q{position:relative;background:var(--tint);border-radius:8px;padding:18px 22px 18px 26px;
  font-size:29px;font-weight:700;line-height:1.3;margin-bottom:18px}
.q::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:6px;background:var(--brand);border-radius:3px 0 0 3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid transparent;
  border-radius:8px;padding:14px 18px;cursor:pointer;font-size:24px;text-align:left;width:100%;
  font-family:var(--font);color:var(--ink)}
.opt:hover:not(.lock){background:var(--tint)}
.opt .k{flex:0 0 42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--tintline);
  display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--deep)}
.opt.pick{border-color:var(--brand);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.lock{cursor:default}
.fb{margin-top:16px;border-radius:8px;padding:14px 20px;font-size:22px;line-height:1.45;display:none}
.fb.on{display:block}
.fb.good{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:4px}

.btn{font-family:var(--font);font-size:19px;font-weight:700;background:var(--brand);color:#fff;
  border:0;border-radius:6px;padding:11px 22px;cursor:pointer}
.btn:hover{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--tintline)}
.row{display:flex;gap:12px;margin-top:16px}

/* ---- reveal ---- */
.rv{background:var(--card);border-radius:8px;padding:14px 20px;margin-bottom:11px;cursor:pointer;
  border-left:4px solid var(--tintline)}
.rv.open{border-left-color:var(--ok);background:var(--okbg)}
.rv b{font-size:24px;display:block}
.rv .a{display:none;margin-top:9px;font-size:21px;color:var(--ink2);line-height:1.45;
  padding-top:9px;border-top:1px dashed var(--tintline)}
.rv.open .a{display:block}
.rv .h{float:right;font-size:16px;color:var(--ink3)}

/* ---- match (kéo–thả) ---- */
.match{display:grid;grid-template-columns:1.45fr 1fr;gap:30px}
.slotrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.slotrow .lb{flex:1;font-size:21px}
.slot{flex:0 0 210px;min-height:46px;border:2px dashed var(--tintline);border-radius:6px;
  display:grid;place-items:center;font-size:18px;color:var(--ink3);background:var(--card);padding:6px 10px;cursor:pointer}
.slot.fill{border-style:solid;background:var(--tint);color:var(--deep);font-weight:700}
.slot.over{border-color:var(--brand);background:var(--tint)}
.slot.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.slot.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.bank::before{content:"NGÂN HÀNG ĐÁP ÁN";width:100%;font-size:15px;letter-spacing:.8px;color:var(--ink3)}
.tok{background:var(--tint);border:2px solid var(--tintline);border-radius:6px;padding:10px 14px;
  font-size:19px;cursor:grab;user-select:none;color:var(--deep);font-weight:700}
.tok.sel{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(166,58,58,.18)}
.tok.used{display:none}

/* ---- practice ---- */
.chips{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chips .c{background:var(--tint);color:var(--deep);font-size:18px;font-weight:700;padding:8px 16px;border-radius:6px}
.box{background:var(--card);border-left:4px solid var(--brand);border-radius:6px;padding:14px 20px;margin-bottom:12px}
.box h4{margin:0 0 8px;font-size:16px;letter-spacing:.8px;color:var(--deep)}
.task{display:flex;gap:12px;align-items:flex-start;font-size:21px;color:var(--ink2);margin-bottom:8px;cursor:pointer}
.task input{width:20px;height:20px;margin-top:4px;accent-color:var(--brand)}
.task.done{color:var(--ink3);text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ---- open (thảo luận) ---- */
.ta{width:100%;min-height:120px;border:2px solid var(--line);border-radius:8px;padding:12px 14px;
  font-family:var(--font);font-size:21px;resize:none}
.ta:focus{outline:none;border-color:var(--brand)}
.hints{margin-top:14px;display:none}
.hints .h{background:var(--card);border-left:4px solid var(--tintline);border-radius:6px;
  padding:10px 16px;font-size:20px;color:var(--ink2);margin-bottom:8px}

/* ---- results ---- */
.score{display:grid;place-items:center;padding-top:14px}
.score .big{font-size:84px;font-weight:700;color:var(--deep);line-height:1}
.score .lab{font-size:21px;color:var(--ink3);margin-top:6px}
.score .rows{width:100%;margin-top:22px}
.score .r{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:20px}
.score .s{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.score .s.ok{background:var(--ok)}.score .s.no{background:var(--bad)}.score .s.na{background:#B9B5B2}

/* ---- vỏ điều khiển ---- */
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--brand);width:0;transition:width .2s;z-index:5}
#hud{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;font-size:13px;color:#EDEAE8;z-index:20}
#hud button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:5px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--font)}
#hud button:hover{background:rgba(255,255,255,.25)}
#pos{font-variant-numeric:tabular-nums;opacity:.8}
#clock{font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);
  border-radius:5px;padding:7px 12px;opacity:.55}
#clock.run{opacity:1;background:rgba(255,255,255,.22)}
#clock.over{background:var(--bad);color:#fff;opacity:1}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:#17171A;color:#E8E4E1;
  padding:16px 26px 22px;font-size:15px;line-height:1.6;border-top:3px solid var(--brand);display:none;z-index:25}
#notes.on{display:block}
#notes h5{margin:0 0 6px;font-size:12px;letter-spacing:1.2px;color:#E0A9A9;text-transform:uppercase}
#notes .npbox p{margin:0 0 8px;padding:5px 12px;border-left:3px solid transparent;
  border-radius:0 4px 4px 0;opacity:.5;transition:opacity .18s,background .18s}
#notes .npbox p.on{opacity:1;background:rgba(224,169,169,.16);border-left-color:var(--brand)}

/* Nhấn mạnh từng đoạn: sw chưa tới · sc đang đọc · sd đã qua */
.sw{opacity:.24;transition:opacity .22s}
.sd{opacity:1;transition:opacity .22s}
.sc{opacity:1;position:relative;animation:pulse .34s ease-out 1}
.pt.sc>span,.task.sc>span{background:linear-gradient(transparent 62%,var(--tintline) 62%);font-weight:700}
.goal.sc,.flow .st.sc,.rv.sc{box-shadow:0 0 0 3px rgba(166,58,58,.28);border-radius:8px}
@keyframes pulse{0%{transform:scale(1)}55%{transform:scale(1.022)}100%{transform:scale(1)}}
body.shot .sw{opacity:1}body.shot .sc{animation:none}
#grid{position:fixed;inset:0;background:#1B1B1F;z-index:30;display:none;grid-template-columns:repeat(5,1fr);
  gap:12px;padding:26px;overflow:auto;align-content:start}
#grid.on{display:grid}
#grid .g{background:#fff;border-radius:6px;padding:12px;cursor:pointer;border:3px solid transparent;min-height:88px}
#grid .g.cur{border-color:var(--brand)}
#grid .gi{font-size:11px;color:var(--ink3)}
#grid .gm{float:right;font-weight:700;color:var(--brand)}
#grid .gt{font-size:13px;font-weight:700;margin-top:4px;line-height:1.25}
#grid .gp{font-size:10px;color:var(--brand);text-transform:uppercase;letter-spacing:.6px;margin-top:6px}

body.shot #hud,body.shot #notes,body.shot #bar{display:none!important}
body.shot{background:#fff}body.shot #stage{box-shadow:none}

</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="bar"></div></div></div>
<div id="notes"></div>
<div id="grid"></div>
<div id="hud">
  <span id="clock" title="Đồng hồ tiết dạy — T chạy/dừng, R đặt lại">00:00</span>
  <span id="pos">–</span>
  <button id="prev" title="Slide trước (←)">←</button>
  <button id="next" title="Slide sau (→)">→</button>
  <button id="tg" title="Tổng quan (O)">Tổng quan</button>
  <button id="tn" title="Kịch bản giảng viên (N)">Kịch bản</button>
</div>
<script>window.SPEC = {"meta": {"title": "Mô hình thực thể – liên kết", "audience": "Sinh viên năm 2 ngành Công nghệ thông tin", "duration": 100, "course": "Cơ sở dữ liệu (DBS201)", "lecturer": "Nguyễn Tất Phú Cường", "date": "Học kỳ 1 · Năm học 2025–2026", "school": "Trường Đại học Kiến trúc Đà Nẵng", "faculty": "Khoa Công nghệ Thông tin", "logo": "THAMKHAO/Logo_dhktdn.png", "website": "dau.edu.vn", "footer": "Chương 2 · Phần 1/4 · Khoa Công nghệ Thông tin · Đại học Kiến trúc Đà Nẵng", "source": "Bai-giang_Chuong-2_Mo-hinh-ER.md — mục 2.1 và 2.2", "objectives": [{"type": "knowledge", "bloom": "hiểu", "text": "Nêu được vai trò của quy tắc nghiệp vụ", "detail": "Nguyên liệu đầu vào của toàn bộ thiết kế quan niệm"}, {"type": "knowledge", "bloom": "hiểu", "text": "Đọc được một lược đồ ER nhỏ theo ký pháp Chen", "detail": "Chữ nhật, oval, hình thoi và cách đọc thành câu"}, {"type": "skill", "bloom": "vận dụng", "text": "Phân loại thuộc tính theo bốn cặp tiêu chí", "detail": "Cấu trúc, số giá trị, nguồn gốc, tính bắt buộc"}, {"type": "skill", "bloom": "vận dụng", "text": "Xử lý thuộc tính đa trị bằng cách tách thực thể", "detail": "Nhận ra chữ nhiều trong đề và tách thành thực thể riêng"}, {"type": "attitude", "bloom": "đánh giá", "text": "Đánh giá một quy tắc nghiệp vụ có đếm được không", "detail": "Đòi hỏi phát biểu rõ hai chiều thay vì tự suy đoán"}]}, "slides": [{"layout": "title", "phase": "khoi-dong", "minutes": 2, "title": "Mô hình thực thể – liên kết", "subtitle": "Phần 1/4 — Quy tắc nghiệp vụ · Lược đồ ER · Thực thể và thuộc tính", "notes": "Xin chào cả lớp. Hôm nay chúng ta bắt đầu Chương 2, chương dạy cách thiết kế cơ sở dữ liệu bằng phương pháp thay vì bằng cảm tính. Chương 1 đã cho thấy một bảng phẳng sinh ra ba loại dị thường, và cách chữa là tách bảng. Nhưng cách tách ấy dựa vào mắt nhìn. Chương 2 thay mắt nhìn bằng một quy trình có thể kiểm chứng được. Phần đầu tiên trong bốn phần hôm nay đi từ nguyên liệu là quy tắc nghiệp vụ, tới sản phẩm là lược đồ ER, rồi vào hai thành phần đầu tiên của lược đồ là thực thể và thuộc tính."}, {"layout": "objectives", "phase": "khoi-dong", "minutes": 3, "title": "Mục tiêu buổi học", "notes": "Mục tiêu thứ nhất là nêu được vai trò của quy tắc nghiệp vụ. Đây là thứ quyết định mọi việc còn lại, vì thiết kế sai gần như luôn bắt nguồn từ việc hiểu sai nghiệp vụ chứ không phải từ việc vẽ xấu.\n\nMục tiêu thứ hai là đọc được một lược đồ ER nhỏ. Đọc trước rồi mới vẽ, giống như học đọc bản đồ trước khi tự vẽ bản đồ.\n\nMục tiêu thứ ba là phân loại thuộc tính theo bốn cặp tiêu chí. Bốn cặp này độc lập nhau, nên một thuộc tính mang bốn nhãn cùng lúc.\n\nMục tiêu thứ tư là xử lý đúng thuộc tính đa trị. Đây là quyết định thiết kế đầu tiên trong chương chỉ có một đáp án đúng duy nhất.\n\nMục tiêu cuối cùng thuộc về thái độ nghề nghiệp: đánh giá được một phát biểu của khách hàng có dùng được hay không, và biết hỏi lại khi nó còn mơ hồ."}, {"layout": "diagram", "phase": "khoi-dong", "minutes": 2, "title": "Lộ trình buổi học", "steps": [{"label": "Quy tắc nghiệp vụ", "desc": "Nguyên liệu đầu vào lấy ở đâu ra?"}, {"label": "Lược đồ ER", "desc": "Sản phẩm cần vẽ trông như thế nào?"}, {"label": "Thực thể", "desc": "Khi nào một danh từ đáng thành thực thể?"}, {"label": "Thuộc tính", "desc": "Bốn cặp phân loại và ca đa trị"}], "note": "Câu hỏi xuyên suốt: từ một đoạn mô tả bằng lời, làm sao ra được lược đồ?", "notes": "Chặng thứ nhất trả lời câu hỏi nguyên liệu ở đâu ra. Thiết kế không bắt đầu từ bảng biểu mà bắt đầu từ lời kể của người dùng hệ thống.\n\nChặng thứ hai cho thấy sản phẩm cuối cùng trông thế nào. Nhìn thấy đích trước thì các khái niệm ở giữa mới có chỗ để gắn vào.\n\nChặng thứ ba đi vào thành phần đầu tiên của lược đồ, và câu hỏi khó ở đây là khi nào một danh từ xứng đáng trở thành thực thể.\n\nChặng thứ tư là thuộc tính, với bốn cặp phân loại và một ca đặc biệt bắt buộc phải xử lý. Câu hỏi xuyên suốt cả buổi nằm ở khung dưới, và cuối buổi chúng ta sẽ quay lại trả lời nó."}, {"layout": "bullets", "phase": "khoi-dong", "minutes": 2, "title": "Vì sao trực giác không đủ", "bullets": ["Bảng sáu cột thì mắt nhìn ra ngay chỗ lặp", "Bốn mươi bảng, hai trăm cột thì không ai nhìn ra", "Hai người thiết kế cho hai kết quả khác nhau", "Trực giác chỉ nhìn được dữ liệu đã có sẵn"], "note": "Việc thật thường bắt đầu khi chưa có dữ liệu nào, chỉ có lời kể của khách hàng.", "notes": "Trực giác có một đặc điểm nguy hiểm. Nó hoạt động rất tốt trên bài toán nhỏ, nên người ta tin tưởng nó.\n\nRồi người ta mang nó áp cho bài toán lớn và thất bại. Với một hệ thống bốn mươi bảng, không mắt người nào nhìn ra hết chỗ dư thừa.\n\nTệ hơn nữa là hai người cùng dùng trực giác sẽ cho hai kết quả khác nhau, và không ai có cơ sở gì để nói ai đúng. Thiết kế trở thành chuyện tranh cãi cảm tính.\n\nVấn đề sâu nhất nằm ở dòng cuối. Trực giác chỉ nhìn được vào dữ liệu đã có sẵn, trong khi công việc thật của người thiết kế thường bắt đầu lúc chưa có bảng nào để mà nhìn."}, {"layout": "quiz", "phase": "khoi-dong", "minutes": 3, "role": "diagnostic", "title": "Ba bảng của Chương 1 đã đủ chưa", "question": "Chương 1 tách bảng phẳng của Trung tâm ABC thành ba bảng và hết dị thường. Thiết kế ấy đã đầy đủ chưa?", "options": ["Đủ rồi, vì cả ba loại dị thường đều đã biến mất", "Chưa đủ, vì còn nhiều sự vật trong nghiệp vụ chưa được lưu", "Chưa đủ, vì ba bảng thì luôn ít hơn mức tối thiểu là năm bảng"], "answer": 1, "explain": "Hết dị thường mới chỉ là hết lỗi trên phần dữ liệu đã có. Phương pháp ER áp cho cùng bài toán này cho ra bảy thực thể, vì nó mô hình hóa nghiệp vụ chứ không dọn dẹp dữ liệu sẵn có. Không có con số tối thiểu nào cho số bảng.", "notes": "Câu này để đo xem lớp đang nghĩ thiết kế là gì. Ai chọn phương án đầu tiên thì đang hiểu thiết kế là dọn dẹp dữ liệu, và đó chính là hiểu lầm mà cả chương này sửa. Nếu quá một nửa lớp chọn phương án đó thì phần lộ trình phía trước cần giảng chậm hơn và nhấn kỹ vào ý dữ liệu hiện có chỉ phản ánh phần rất nhỏ của nghiệp vụ. Ai chọn phương án cuối thì cần nói rõ ngay rằng không có con số tối thiểu nào cả, số thực thể do nghiệp vụ quyết định."}, {"layout": "diagram", "phase": "hinh-thanh", "minutes": 3, "title": "Ba mức thiết kế cơ sở dữ liệu", "steps": [{"label": "Quan niệm", "desc": "Nghiệp vụ có những gì? — Chương 2"}, {"label": "Logic", "desc": "Tổ chức thành bảng ra sao? — Chương 3"}, {"label": "Vật lý", "desc": "Lưu lên đĩa thế nào? — học phần sau"}], "note": "Đây chính là ba mức mô hình dữ liệu ở mục 1.4.3, nhìn dưới góc độ quy trình làm việc.", "notes": "Mức quan niệm trả lời câu hỏi nghiệp vụ có những gì. Kết quả là một lược đồ ER mô tả thế giới thực, hoàn toàn độc lập với mọi công nghệ. Toàn bộ chương này nằm ở mức đó.\n\nMức logic trả lời câu hỏi tổ chức thành bảng ra sao. Kết quả là một tập các quan hệ có khóa chính và khóa ngoại đầy đủ. Đó là Chương 3 và một phần Chương 5.\n\nMức vật lý trả lời câu hỏi lưu lên đĩa thế nào, gồm chọn kiểu dữ liệu, tạo chỉ mục, phân vùng. Phần này thuộc học phần Hệ quản trị cơ sở dữ liệu, ta chỉ cần biết nó tồn tại."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Trình tự ba mức là bắt buộc", "bullets": ["Sai lầm phổ biến nhất: nhảy thẳng vào thiết kế bảng", "Hậu quả: thiết kế bám lời văn tình cờ của đề bài", "Nghiệp vụ đổi một chút, toàn bộ thiết kế phải làm lại"], "notes": "Sai lầm phổ biến nhất của người mới học là đọc xong đề bài liền vẽ bảng ngay, bỏ qua mức quan niệm. Cảm giác lúc đó là mình đang tiết kiệm thời gian.\n\nHậu quả là thiết kế bám sát cách diễn đạt tình cờ của đề bài thay vì bám sát bản chất nghiệp vụ. Đề viết theo thứ tự nào thì bảng ra theo thứ tự đó.\n\nVà khi nghiệp vụ thay đổi một chút thôi thì toàn bộ thiết kế phải làm lại từ đầu. Thời gian tiết kiệm được ở bước đầu phải trả lại gấp nhiều lần ở bước sau."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Quy tắc nghiệp vụ — nguyên liệu đầu vào", "bullets": ["Phát biểu ngắn gọn, rõ ràng, bằng ngôn ngữ tự nhiên", "Mô tả một chính sách, quy trình hoặc ràng buộc của tổ chức", "Thu thập từ phỏng vấn người dùng hệ thống", "Thu thập từ tài liệu, biểu mẫu và quan sát thực tế"], "note": "Quy tắc nghiệp vụ không do người thiết kế nghĩ ra — chúng được thu thập.", "notes": "Định nghĩa rất gọn. Quy tắc nghiệp vụ là một phát biểu ngắn, rõ ràng, viết bằng ngôn ngữ tự nhiên chứ không phải bằng ký hiệu kỹ thuật.\n\nNội dung của nó là một chính sách, một quy trình hoặc một ràng buộc trong hoạt động của tổ chức. Bất cứ điều gì tổ chức quy định đều có thể thành quy tắc.\n\nNguồn thứ nhất là phỏng vấn những người thật sự dùng hệ thống. Đây là nguồn giàu thông tin nhất và cũng dễ bị bỏ qua nhất.\n\nHai nguồn còn lại là đọc tài liệu, biểu mẫu hiện hành, và quan sát quy trình làm việc thực tế. Cả ba đều là công việc của con người với con người, không phải công việc kỹ thuật, nhưng chất lượng toàn bộ thiết kế phụ thuộc vào nó."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ba vai trò của quy tắc nghiệp vụ", "bullets": ["Xác định phạm vi: cái gì cần lưu, cái gì không", "Quyết định cấu trúc: mỗi quy tắc ứng một thành phần lược đồ", "Làm căn cứ tranh luận khi hai người thiết kế bất đồng"], "notes": "Vai trò thứ nhất là xác định phạm vi. Không phải mọi thứ trong đời thực đều cần đưa vào hệ thống, và ranh giới ấy do quy tắc nghiệp vụ vạch ra.\n\nVai trò thứ hai là quyết định cấu trúc. Mỗi quy tắc thường ứng với một thành phần cụ thể của lược đồ, và lát nữa chúng ta sẽ có hẳn một bảng phiên dịch.\n\nVai trò thứ ba là làm căn cứ tranh luận. Khi hai người thiết kế bất đồng, cách giải quyết không phải là ai lớn tiếng hơn mà là quay lại đọc quy tắc nghiệp vụ. Đây là điều làm cho thiết kế trở thành một nghề có kỷ luật."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 2, "title": "Ba phát biểu, cái nào dùng được", "left": {"heading": "Chưa dùng được", "bullets": ["Chúng tôi quản lý học viên rất chặt chẽ", "Học viên có thể học nhiều lớp"]}, "right": {"heading": "Dùng được", "bullets": ["Một học viên ghi danh nhiều lớp", "Một lớp có nhiều học viên", "Mỗi lượt ghi danh có ngày và học phí"]}, "note": "Từ cột phải rút ra ngay: liên kết nhiều–nhiều, và liên kết ấy có thuộc tính riêng.", "notes": "Phát biểu thứ nhất nghe rất kêu nhưng không phải quy tắc nghiệp vụ. Nó không cho biết cần lưu gì, cũng không nêu ràng buộc nào, nên người thiết kế không rút ra được điều gì.\n\nPhát biểu thứ hai đã chấp nhận được nhưng chưa đủ. Nó cho biết một chiều của mối liên hệ và bỏ mất chiều kia, mà chiều kia mới là chỗ hay sai.\n\nSang cột phải, câu thứ nhất cho biết chiều đi từ học viên sang lớp.\n\nCâu thứ hai bổ sung chiều ngược lại, và chỉ khi có đủ hai chiều ta mới kết luận được loại liên kết.\n\nCâu thứ ba nói rằng mỗi lượt ghi danh có dữ liệu riêng. Ba câu ấy gộp lại cho ta hai kết luận thiết kế ngay lập tức, ghi ở khung dưới."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ba đặc điểm của một quy tắc tốt", "bullets": ["Nói về một sự việc cụ thể, không phải một cảm nhận chung", "Dùng từ chỉ số lượng: một, nhiều, không quá, ít nhất", "Nêu cả hai chiều khi mô tả liên hệ giữa hai sự vật"], "note": "Tiêu chí gộp lại thành một chữ: đếm được.", "notes": "Đặc điểm thứ nhất là nói về một sự việc cụ thể. Cảm nhận chung kiểu quản lý chặt chẽ hay phục vụ tận tâm đều không dùng được.\n\nĐặc điểm thứ hai là dùng các từ chỉ số lượng, để người đọc đếm được. Chính những từ này về sau trở thành con số trên cạnh nối của lược đồ.\n\nĐặc điểm thứ ba là nêu cả hai chiều. Khi khách hàng chỉ nói một chiều, nhiệm vụ của người thiết kế không phải là tự đoán mà là hỏi lại cho rõ. Câu hỏi hữu ích nhất luôn có dạng một X thì liên quan tới bao nhiêu Y, và phải hỏi cả chiều ngược lại."}, {"layout": "reveal", "phase": "luyen-tap", "minutes": 3, "title": "Sửa lại ba phát biểu mơ hồ", "prompt": "Mỗi phát biểu dưới đây đều chưa đếm được. Hãy sửa lại trước khi xem gợi ý.", "items": [{"q": "Trung tâm có nhiều phòng học và sắp xếp lịch rất linh hoạt.", "a": "Mỗi lớp học tại một phòng; một phòng phục vụ nhiều lớp ở các khung giờ khác nhau."}, {"q": "Ai trong tổ chuyên môn cũng có thể đứng lớp.", "a": "Mỗi LOP do đúng một GIAOVIEN phụ trách; một GIAOVIEN phụ trách nhiều LOP hoặc chưa LOP nào."}, {"q": "Học viên đóng học phí theo quy định.", "a": "Mỗi lượt ghi danh ghi nhận một mức học phí riêng, có thể khác nhau giữa các học viên cùng lớp."}], "notes": "Phát biểu thứ nhất mắc lỗi dùng từ linh hoạt, một từ không đếm được. Hãy để lớp thử sửa trong ba mươi giây rồi mới lật thẻ. Bản sửa nêu rõ hai chiều giữa lớp và phòng học.\n\nPhát biểu thứ hai mắc lỗi nói về khả năng chung chung thay vì nói về ràng buộc. Bản sửa nêu đủ hai chiều và giữ lại cụm chưa lớp nào, vì cụm ấy sẽ thành tính tham gia tùy chọn.\n\nPhát biểu thứ ba nghe như đã rõ nhưng thật ra chưa nói học phí gắn vào đâu. Bản sửa gắn nó vào từng lượt ghi danh, và đó chính là manh mối dẫn tới một thực thể mới ở buổi sau. Nếu lớp sửa mà vẫn quên nêu hai chiều thì quay lại slide ba đặc điểm và nhấn lại tiêu chí thứ ba."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 1, "title": "Đã có gì, hỏi tiếp gì", "bullets": ["Đã có: nguyên liệu là các quy tắc nghiệp vụ đếm được", "Câu hỏi tiếp: sản phẩm làm ra trông như thế nào?", "Chặng tới: nhìn một lược đồ ER hoàn chỉnh cỡ nhỏ"], "notes": "Đến đây chúng ta đã có nguyên liệu trong tay, tức là các quy tắc nghiệp vụ đã đủ rõ để đếm được.\n\nCâu hỏi tự nhiên tiếp theo là sản phẩm làm ra từ nguyên liệu ấy trông như thế nào. Rất khó học các thành phần khi chưa từng thấy cái toàn thể.\n\nVì vậy chặng tới sẽ xem một lược đồ ER hoàn chỉnh nhưng cỡ nhỏ, chỉ vừa đủ để nhận ra ba loại hình vẽ."}, {"layout": "image-text", "phase": "hinh-thanh", "minutes": 3, "title": "Lược đồ ER là gì", "image": "hinh-ve/Chuong-2_Mo-hinh-ER_hinh01_45af9f4e.png", "caption": "Hình 2.1. Một lược đồ ER nhỏ — hai thực thể, các thuộc tính và một liên kết", "source": "Bai-giang_Chuong-2_Mo-hinh-ER.md, mục 2.1.4", "bullets": ["Chữ nhật GIAOVIEN và LOP là hai thực thể", "Các oval quanh chúng là thuộc tính", "Hình thoi phụ trách ở giữa là liên kết"], "notes": "Đây là toàn bộ sản phẩm của thiết kế quan niệm, thu nhỏ lại vừa một màn hình. Hai hình chữ nhật là hai loại sự vật mà trung tâm cần lưu thông tin, gọi là thực thể.\n\nCác hình oval nối vào chữ nhật là những đặc điểm cần lưu của sự vật đó, gọi là thuộc tính. Chú ý hai oval có tên được gạch chân, lát nữa ta sẽ nói vì sao.\n\nHình thoi nằm giữa hai chữ nhật là mối liên hệ giữa chúng, gọi là liên kết, và bên trong luôn ghi một động từ. Điều đáng nói là chủ trung tâm, người không biết gì về cơ sở dữ liệu, vẫn nhìn hình này và chỉ ra được chỗ sai. Đó là giá trị lớn nhất của mô hình ER và là lý do nó sống gần năm mươi năm."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Ba thành phần cơ bản", "bullets": ["Thực thể — loại sự vật cần lưu thông tin — hình chữ nhật", "Thuộc tính — đặc điểm của sự vật ấy — hình oval", "Liên kết — mối liên hệ giữa hai thực thể — hình thoi"], "note": "Bộ ký hiệu đầy đủ với khóa, đa trị, dẫn xuất sẽ học ở phần sau của buổi.", "notes": "Thành phần thứ nhất là thực thể, vẽ bằng hình chữ nhật. Đây là loại sự vật hoặc sự kiện mà tổ chức cần lưu thông tin về nó.\n\nThành phần thứ hai là thuộc tính, vẽ bằng hình oval nối vào thực thể bằng một đoạn thẳng. Mỗi oval là một đặc điểm cần lưu.\n\nThành phần thứ ba là liên kết, vẽ bằng hình thoi đặt giữa hai thực thể. Chỉ cần ba loại hình này là đã đọc được phần lớn các lược đồ ER. Những ký hiệu còn lại đều là sắc thái thêm vào ba loại cơ bản ấy, và ta sẽ học đủ bộ ở phần sau."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Đọc lược đồ ER thành câu tiếng Việt", "bullets": ["Đọc theo mẫu: danh từ — động từ — danh từ", "Một GIAOVIEN phụ trách nhiều LOP", "Một LOP do một GIAOVIEN phụ trách", "Đọc thành tiếng thì lỗi thiết kế tự lộ ra"], "notes": "Cách đọc một lược đồ ER rất máy móc, và đó là ưu điểm. Ta đọc theo mẫu danh từ, động từ, danh từ, tức là tên thực thể, tên liên kết, tên thực thể kia.\n\nÁp vào hình vừa xem, chiều thứ nhất đọc là một giáo viên phụ trách nhiều lớp. Con số M ở đầu phía lớp cho biết chữ nhiều đó.\n\nChiều thứ hai đọc ngược lại là một lớp do một giáo viên phụ trách, nhờ con số một ở đầu phía giáo viên.\n\nKinh nghiệm quan trọng nhất nằm ở dòng cuối. Hãy tập đọc lược đồ thành tiếng. Khi câu đọc lên nghe vô lý thì lược đồ sai, và cách kiểm tra ấy nhanh hơn mọi cách kiểm tra khác."}, {"layout": "quiz", "phase": "luyen-tap", "minutes": 3, "title": "Đọc đúng lược đồ nhỏ này", "question": "Trong Hình 2.1, đầu phía LOP ghi chữ M còn đầu phía GIAOVIEN ghi số 1. Cách đọc nào đúng?", "options": ["Một LOP có nhiều GIAOVIEN phụ trách", "Một GIAOVIEN phụ trách nhiều LOP", "Mỗi GIAOVIEN phụ trách đúng một LOP"], "answer": 1, "explain": "Quy ước của giáo trình là con số ghi ở đầu nào thì mô tả số lượng thực thể ở đầu đó. Chữ M nằm ở đầu phía LOP nên phía lớp là nhiều, tức một GIAOVIEN phụ trách nhiều LOP. Phương án đầu là lỗi đọc ngược, lỗi phổ biến nhất khi mới đọc lược đồ.", "notes": "Đây là bài kiểm tra kỹ năng đọc, và cũng là chỗ bẫy quen thuộc. Rất nhiều người nhìn thấy chữ M cạnh lớp rồi kết luận một lớp có nhiều giáo viên. Nếu quá một phần ba lớp chọn phương án đầu tiên thì cần dừng lại làm mẫu trên bảng thêm một liên kết nữa, và nhắc lại mẹo che một đầu rồi đọc đầu còn lại. Cũng nói luôn rằng một số tài liệu ghi con số theo quy ước ngược, nên khi đọc lược đồ của người khác việc đầu tiên là kiểm tra quy ước bằng một liên kết mình đã chắc chắn."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 3, "title": "Phiên dịch quy tắc nghiệp vụ sang lược đồ", "left": {"heading": "Trong câu quy tắc", "bullets": ["Danh từ chỉ sự vật cần lưu thông tin", "Động từ nối hai danh từ", "Từ chỉ số lượng: một, nhiều"]}, "right": {"heading": "Thành phần lược đồ", "bullets": ["Thực thể — hình chữ nhật", "Liên kết — hình thoi", "Kết nối 1:1, 1:M hay M:N"]}, "note": "Đây là gợi ý khởi đầu, không phải công thức máy móc.", "notes": "Bảng phiên dịch này nối nguyên liệu với sản phẩm. Loại từ trong câu quy tắc gợi ý loại thành phần trong lược đồ.\n\nDanh từ chỉ sự vật cần lưu thông tin thường thành thực thể. Ví dụ câu trung tâm có nhiều giáo viên cho ta thực thể giáo viên.\n\nĐộng từ nối hai danh từ thường thành liên kết. Ví dụ mỗi lớp do một giáo viên phụ trách cho ta liên kết phụ trách.\n\nCòn từ chỉ số lượng thì quyết định loại kết nối. Bên phải là ba thành phần tương ứng, đúng ba hình vẽ ta vừa học.\n\nHình thoi mang tên động từ chính là lý do Chen dành hẳn một ký hiệu riêng cho liên kết.\n\nCần nhấn mạnh dòng dưới cùng: đây là gợi ý khởi đầu chứ không phải quy tắc tuyệt đối. Không phải danh từ nào cũng thành thực thể, và tiêu chí phân biệt sẽ có ngay sau đây."}, {"layout": "match", "phase": "luyen-tap", "minutes": 3, "title": "Ghép cụm từ với thành phần lược đồ", "prompt": "Kéo thành phần ở cột phải vào đúng cụm từ trong quy tắc nghiệp vụ.", "pairs": [{"left": "trung tâm mở nhiều lớp học", "right": "Thực thể"}, {"left": "mỗi lớp thuộc một khóa học", "right": "Liên kết"}, {"left": "một khóa học mở nhiều lớp", "right": "Kết nối 1:M"}, {"left": "lớp có thể chưa có học viên nào", "right": "Tham gia tùy chọn"}, {"left": "học viên có nhiều số điện thoại", "right": "Thuộc tính đa trị"}], "explain": "Mẹo chung: danh từ chỉ sự vật thành thực thể, động từ thành liên kết, từ chỉ số lượng thành kết nối, cụm có thể hoặc chưa thành tham gia tùy chọn, và chữ nhiều đứng trước một đặc điểm là dấu hiệu thuộc tính đa trị.", "notes": "Bài ghép này rèn phản xạ phiên dịch, và hai cặp cuối cùng là hai cụm từ quan trọng nhất cần nhớ. Cụm có thể và cụm chưa báo hiệu tính tham gia tùy chọn, còn chữ nhiều đứng trước một đặc điểm báo hiệu thuộc tính đa trị. Hai thứ này ta chưa học kỹ, nên chỉ cần nhận mặt được là đủ, buổi sau và phần cuối buổi này sẽ nói rõ. Nếu lớp ghép sai nhiều ở cặp thứ ba thì nhắc lại rằng từ chỉ số lượng quyết định kết nối chứ không quyết định liên kết."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 1, "title": "Đã có gì, hỏi tiếp gì", "bullets": ["Đã có: bản đồ phiên dịch từ lời sang hình", "Câu hỏi tiếp: khi nào một danh từ đáng thành thực thể?", "Chặng tới: thực thể, bộ ký hiệu Chen, rồi thuộc tính"], "notes": "Chúng ta đã có bản đồ phiên dịch từ lời nói sang hình vẽ, đủ để bắt đầu làm việc.\n\nNhưng bảng ấy chỉ là gợi ý, và câu hỏi khó vẫn còn nguyên: khi nào một danh từ thật sự đáng trở thành thực thể.\n\nPhần còn lại của buổi trả lời câu hỏi đó, rồi học đủ bộ ký hiệu Chen, và cuối cùng đi sâu vào thuộc tính."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Thực thể và thể hiện thực thể", "bullets": ["Thực thể là một loại sự vật hoặc sự kiện cần lưu thông tin", "Thể hiện thực thể là một cá thể cụ thể thuộc loại đó", "HOCVIEN là cái khuôn; HV01 Trần An là một cá thể", "Lược đồ chỉ vẽ thực thể, không vẽ thể hiện"], "note": "Đây chính là cặp lược đồ và thể hiện đã học ở mục 1.4.4, đổi tên gọi.", "notes": "Thực thể, nói chính xác hơn là kiểu thực thể, là một loại sự vật hoặc sự kiện mà tổ chức cần lưu trữ thông tin về nó.\n\nThể hiện thực thể là một cá thể cụ thể thuộc loại ấy. Hai khái niệm này khác nhau về cấp độ chứ không khác nhau về nội dung.\n\nLấy ví dụ cho dễ hình dung. Học viên là một thực thể, nó là cái khuôn mô tả rằng mọi học viên đều có mã, họ tên, ngày sinh. Còn dòng ghi mã HV01, tên Trần An, sinh năm 2005 là một thể hiện, tức một cá thể đúc ra từ khuôn ấy.\n\nHệ quả thực hành nằm ở dòng cuối. Trong lược đồ ta chỉ vẽ thực thể; các thể hiện chỉ xuất hiện khi hệ thống đã chạy và có dữ liệu thật. Khung dưới nhắc rằng đây đúng là cặp lược đồ và thể hiện đã gặp ở Chương 1, chỉ đổi tên gọi."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Khi nào một danh từ đáng thành thực thể", "bullets": ["Có nhiều hơn một đặc điểm cần lưu", "Có nhiều cá thể phân biệt được với nhau", "Có liên kết với sự vật khác trong hệ thống"], "note": "Thiếu một trong ba thì thường nó chỉ nên là thuộc tính, hoặc nằm ngoài phạm vi.", "notes": "Tiêu chí thứ nhất là có nhiều hơn một đặc điểm cần lưu. Nếu về màu sắc ta chỉ cần lưu đúng tên màu thì màu sắc nên là thuộc tính. Nhưng nếu còn cần mã màu, nhà cung cấp sơn và ngày cập nhật thì nó đã đủ tư cách làm thực thể.\n\nTiêu chí thứ hai là có nhiều cá thể phân biệt được. Một sự vật chỉ tồn tại đúng một bản, chẳng hạn bản thân trung tâm ABC, thì không nên làm thực thể vì bảng tương ứng chỉ có một dòng.\n\nTiêu chí thứ ba là có liên kết với sự vật khác. Một danh từ đứng biệt lập, không liên hệ với bất cứ gì trong hệ thống, thường là dấu hiệu nó nằm ngoài phạm vi bài toán và nên bỏ đi."}, {"layout": "quiz", "phase": "luyen-tap", "minutes": 3, "title": "Màu sắc có nên là thực thể", "question": "Một cửa hàng sơn cần lưu tên màu, mã màu, nhà cung cấp và ngày cập nhật bảng màu. Màu sắc nên là gì?", "options": ["Thuộc tính, vì màu sắc chỉ là một đặc điểm của sản phẩm", "Thực thể, vì nó có nhiều đặc điểm cần lưu và có liên kết riêng", "Không lưu gì cả, vì màu sắc không phải dữ liệu nghiệp vụ"], "answer": 1, "explain": "Cùng một danh từ có thể là thuộc tính ở hệ thống này và là thực thể ở hệ thống khác. Ở đây màu sắc có bốn đặc điểm cần lưu và liên kết với nhà cung cấp, nên đạt cả ba tiêu chí. Nếu chỉ cần lưu mỗi tên màu thì nó chỉ nên là thuộc tính.", "notes": "Điểm cần rút ra không phải là đáp án mà là cách lập luận. Cùng một danh từ có thể là thuộc tính ở hệ thống này và là thực thể ở hệ thống khác, tùy nghiệp vụ cần lưu bao nhiêu đặc điểm. Nếu lớp trả lời sai thì đừng vội chữa, hãy hỏi ngược lại rằng nếu cửa hàng chỉ cần lưu tên màu thôi thì câu trả lời có đổi không. Chính câu hỏi ấy dạy được điều mà đáp án không dạy được."}, {"layout": "image-text", "phase": "hinh-thanh", "minutes": 3, "title": "Bộ ký hiệu Chen — đủ bộ", "image": "hinh-ve/Chuong-2_Mo-hinh-ER_hinh02_48380a5e.png", "caption": "Hình 2.2. Bộ ký hiệu Chen — khóa gạch chân, đa trị viền kép, dẫn xuất nét đứt", "source": "Bai-giang_Chuong-2_Mo-hinh-ER.md, mục 2.2.2", "bullets": ["Tên gạch chân là thuộc tính khóa", "Viền kép là đa trị; nét đứt là dẫn xuất", "Chữ nhật hai viền là thực thể yếu"], "notes": "Hình này là bộ ký hiệu đầy đủ, mở rộng từ ba hình cơ bản đã học. Oval có tên gạch chân là thuộc tính khóa, dùng để phân biệt các cá thể với nhau. Chi tiết về khóa sẽ học ở phần sau của chương.\n\nOval hai đường viền là thuộc tính đa trị, còn oval nét đứt là thuộc tính dẫn xuất. Cả hai đều sẽ được nói kỹ ở cuối buổi hôm nay.\n\nChữ nhật hai đường viền là thực thể yếu, nối qua hình thoi hai viền gọi là liên kết định danh. Phần này để dành cho buổi sau, bây giờ chỉ cần nhận mặt. Một lưu ý về hình vẽ: công cụ vẽ thể hiện oval thành hình bo tròn hai đầu và thể hiện hai đường viền bằng viền dày, nhưng khi vẽ tay thì hãy vẽ oval thật và hai viền thật."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Vì sao giáo trình chọn ký pháp Chen", "bullets": ["Là ký pháp gốc, do Peter Chen đề xuất năm 1976", "Tường minh nhất: mỗi khái niệm một ký hiệu riêng", "Buộc người vẽ phải nghĩ: mỗi nét là một quyết định"], "note": "Crow's Foot gọn hơn nhưng giấu bớt quyết định — hợp lúc làm tài liệu, không hợp lúc học.", "notes": "Lý do thứ nhất là tính chính danh. Đây là ký pháp gốc, do chính Peter Chen đề xuất năm 1976 cùng với mô hình ER.\n\nLý do thứ hai là tính tường minh. Mỗi khái niệm có một ký hiệu riêng nên nhìn vào hình là đọc ra ngay, không cần tra bảng quy ước kèm theo.\n\nLý do thứ ba quan trọng nhất về mặt sư phạm. Chen buộc người vẽ phải nghĩ: muốn vẽ thuộc tính đa trị phải cố tình vẽ hai đường viền, muốn vẽ thuộc tính khóa phải cố tình gạch chân. Mỗi nét vẽ là một quyết định thiết kế được ghi lại. Ký pháp Crow's Foot gọn hơn nhưng giấu bớt các quyết định ấy đi, nên hợp giai đoạn làm tài liệu hơn là giai đoạn học."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Thuộc tính và bốn cặp phân loại", "bullets": ["Thuộc tính là một đặc điểm của thực thể mà ta cần lưu", "Bốn cặp tiêu chí độc lập hoàn toàn với nhau", "Một thuộc tính mang bốn nhãn cùng lúc"], "note": "Ví dụ: DIACHI có thể vừa phức hợp, vừa đơn trị, vừa lưu trữ, vừa bắt buộc.", "notes": "Định nghĩa rất ngắn. Thuộc tính là một đặc điểm của thực thể mà ta cần lưu trữ, vẽ bằng hình oval nối vào chữ nhật.\n\nĐiều cần nhớ là bốn cặp tiêu chí sắp trình bày hoàn toàn độc lập với nhau. Chúng không loại trừ nhau và cũng không suy ra được nhau.\n\nHệ quả là mỗi thuộc tính mang bốn nhãn cùng lúc, mỗi cặp một nhãn. Ví dụ ở khung dưới cho thấy địa chỉ có thể vừa phức hợp, vừa đơn trị, vừa lưu trữ, vừa bắt buộc. Bốn slide tiếp theo đi lần lượt từng cặp."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 2, "title": "Cặp một — theo cấu trúc", "left": {"heading": "Đơn", "bullets": ["Không chia nhỏ được nữa", "NGAYSINH, HOTEN, MAHV"]}, "right": {"heading": "Phức hợp", "bullets": ["Gồm nhiều phần đều có nghĩa", "DIACHI gồm số nhà, đường, quận, tỉnh"]}, "note": "Nguyên tắc tách: tách nếu về sau còn cần truy vấn theo từng phần.", "notes": "Thuộc tính đơn là thứ không chia nhỏ được nữa mà vẫn giữ nguyên ý nghĩa.\n\nCác ví dụ quen thuộc là ngày sinh, họ tên, mã học viên. Chúng đứng một mình đã đủ nghĩa.\n\nThuộc tính phức hợp thì gồm nhiều phần, và điều quan trọng là từng phần đều có nghĩa riêng.\n\nĐịa chỉ là ví dụ điển hình, gồm số nhà, tên đường, quận và tỉnh. Câu hỏi thiết kế đặt ra ngay: tách thành các thuộc tính con hay giữ nguyên một khối. Nguyên tắc ghi ở khung dưới, và ta sẽ quay lại nó sau vài slide."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 2, "title": "Cặp hai — theo số giá trị", "left": {"heading": "Đơn trị", "bullets": ["Một cá thể có đúng một giá trị", "HOTEN, NGAYSINH của học viên"]}, "right": {"heading": "Đa trị", "bullets": ["Một cá thể có nhiều giá trị", "SDT của học viên, nhiều bằng cấp một người"]}, "note": "Đây là cặp duy nhất trong bốn cặp có một đáp án bắt buộc — sẽ nói ở cuối buổi.", "notes": "Thuộc tính đơn trị nghĩa là mỗi cá thể chỉ có đúng một giá trị cho đặc điểm ấy.\n\nHọ tên và ngày sinh của học viên là ví dụ. Một người chỉ có một ngày sinh.\n\nThuộc tính đa trị thì ngược lại, một cá thể có thể có nhiều giá trị cùng lúc.\n\nSố điện thoại của học viên là ví dụ kinh điển, bằng cấp của giáo viên cũng vậy. Hãy nhớ kỹ cặp này, vì như khung dưới ghi, đây là cặp duy nhất trong bốn cặp dẫn tới một quyết định bắt buộc chứ không phải một lựa chọn. Cuối buổi ta sẽ dành hẳn một chặng cho nó."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 2, "title": "Cặp ba — theo nguồn gốc", "left": {"heading": "Lưu trữ", "bullets": ["Được nhập vào và cất giữ", "NGAYSINH của học viên"]}, "right": {"heading": "Dẫn xuất", "bullets": ["Tính ra được từ thuộc tính khác", "TUOI tính từ NGAYSINH"]}, "note": "Trong ký pháp Chen, thuộc tính dẫn xuất vẽ bằng oval nét đứt.", "notes": "Thuộc tính lưu trữ là thứ được nhập vào và cất giữ trong hệ thống.\n\nNgày sinh là ví dụ. Không có cách nào tính ra ngày sinh từ dữ liệu khác, buộc phải hỏi và ghi lại.\n\nThuộc tính dẫn xuất thì tính ra được từ thuộc tính khác, nên về nguyên tắc không cần lưu.\n\nTuổi tính từ ngày sinh là ví dụ rõ nhất. Trong ký pháp Chen ta vẫn vẽ nó ra bằng oval nét đứt, để ghi nhận rằng nghiệp vụ có nhu cầu này, nhưng đánh dấu riêng để người làm bước sau biết nó không cần một cột trong bảng. Cuối buổi sẽ có một câu thảo luận về chuyện lưu hay không lưu."}, {"layout": "question", "phase": "van-dung", "minutes": 3, "title": "Sĩ số của lớp — lưu lại hay tính lại", "question": "Sĩ số của một lớp tính được bằng cách đếm số lượt ghi danh. Trung tâm có nên lưu sẵn con số ấy không?", "prompts": ["Lưu lại thì đọc nhanh, nhưng sai khi có người rút lớp", "Tính lại thì luôn đúng, nhưng tốn thời gian xử lý", "Nếu chấp nhận lưu thì cần thêm cơ chế gì?"], "note": "Tiêu chí đánh giá: có nêu được cái giá phải trả của phương án mình chọn hay không.", "notes": "Đây là câu hỏi mở, không có đáp án duy nhất, và mục đích là tập cân nhắc đánh đổi. Nguyên tắc chung là không lưu thuộc tính dẫn xuất, vì lưu lại chính là tạo ra dư thừa, mà dư thừa dẫn tới không nhất quán đúng theo chuỗi nhân quả của Chương 1.\n\nNhưng ngoại lệ có thật khi phép tính quá tốn kém và được dùng liên tục, chẳng hạn phải đếm lại trên hàng vạn dòng ghi danh mỗi lần hiển thị danh sách lớp.\n\nKhi ấy người ta chấp nhận lưu, nhưng phải kèm cơ chế bảo đảm nó luôn khớp. Hãy dẫn lớp tới ý đó thay vì đưa đáp án sẵn. Tình huống này sẽ quay lại ở Chương 4 dưới dạng một ràng buộc toàn vẹn khó, và ở Chương 5 dưới tên gọi phi chuẩn hóa."}, {"layout": "two-column", "phase": "hinh-thanh", "minutes": 2, "title": "Cặp bốn — theo tính bắt buộc", "left": {"heading": "Bắt buộc", "bullets": ["Không được để trống", "HOTEN của học viên"]}, "right": {"heading": "Tùy chọn", "bullets": ["Được phép để trống", "EMAIL của học viên"]}, "note": "Cặp này sẽ thành ràng buộc không rỗng trên cột dữ liệu ở Chương 3.", "notes": "Thuộc tính bắt buộc là thứ không được để trống trong bất kỳ trường hợp nào.\n\nHọ tên học viên là ví dụ. Một dòng dữ liệu không có họ tên thì vô nghĩa.\n\nThuộc tính tùy chọn thì được phép để trống mà dữ liệu vẫn có ý nghĩa.\n\nĐịa chỉ thư điện tử là ví dụ, vì có học viên lớn tuổi không dùng thư điện tử. Cặp này nhìn có vẻ nhỏ nhưng ở Chương 3 nó sẽ trở thành ràng buộc không rỗng trên cột, và xác định sai thì hệ thống hoặc từ chối dữ liệu hợp lệ, hoặc nhận vào dữ liệu thiếu."}, {"layout": "image-text", "phase": "hinh-thanh", "minutes": 3, "title": "Cùng một thực thể, hai ký pháp", "image": "hinh-ve/Chuong-2_Mo-hinh-ER_hinh03_27c9797b.png", "caption": "Hình 2.3. Thực thể HOCVIEN vẽ theo ký pháp Chen và theo ký pháp Crow's Foot", "source": "Bai-giang_Chuong-2_Mo-hinh-ER.md, mục 2.2.3", "bullets": ["Chen trải thuộc tính ra thành oval riêng biệt", "Crow's Foot gom thuộc tính vào trong ô", "Cùng lượng thông tin, khác cách phân bố"], "notes": "Hai cách vẽ chứa cùng một lượng thông tin nhưng phân bố khác hẳn nhau. Bên trái là Chen, trải thuộc tính ra ngoài thành các oval riêng biệt.\n\nBên phải là Crow's Foot, gom thuộc tính vào trong một ô chữ nhật thành danh sách, mỗi thuộc tính một dòng. Gọn hơn rất nhiều.\n\nĐiều đáng nói là cái giá của sự gọn gàng. Vì mỗi thuộc tính chỉ còn là một dòng chữ nên Crow's Foot mất chỗ để thể hiện các sắc thái, thường chỉ giữ lại được gạch chân cho khóa. Đó chính là lý do giáo trình chọn Chen cho phần học lý thuyết và phần giải bài, còn Crow's Foot dùng khi cần trình bày lược đồ lớn."}, {"layout": "match", "phase": "luyen-tap", "minutes": 3, "title": "Ghép thuộc tính với loại của nó", "prompt": "Mỗi thuộc tính dưới đây thuộc loại nào trong bốn cặp phân loại?", "pairs": [{"left": "DIACHI gồm số nhà, đường, quận, tỉnh", "right": "Phức hợp"}, {"left": "SDT của một học viên", "right": "Đa trị"}, {"left": "TUOI tính từ NGAYSINH", "right": "Dẫn xuất"}, {"left": "EMAIL của học viên lớn tuổi", "right": "Tùy chọn"}, {"left": "MAHV do trung tâm cấp", "right": "Đơn và bắt buộc"}], "explain": "Mỗi thuộc tính mang bốn nhãn cùng lúc, ở đây chỉ hỏi nhãn nổi bật nhất. Cách nhận biết: chia nhỏ được thì phức hợp, nhiều giá trị thì đa trị, tính ra được thì dẫn xuất, để trống được thì tùy chọn.", "notes": "Bài ghép này kiểm tra giữa buổi. Lưu ý với lớp rằng mỗi thuộc tính thật ra mang bốn nhãn cùng lúc, ở đây ta chỉ hỏi nhãn nổi bật nhất của từng cái. Cặp cuối cùng cố tình ghép hai nhãn để lớp thấy điều đó. Nếu có nhóm ghép nhầm đa trị với phức hợp thì đây là chỗ cần dừng lại, vì hai khái niệm này rất hay lẫn: phức hợp là một giá trị chia được thành nhiều phần, còn đa trị là nhiều giá trị riêng biệt của cùng một đặc điểm."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Tách thuộc tính phức hợp khi nào", "bullets": ["Tách nếu về sau còn cần truy vấn theo từng phần", "Cần thống kê học viên theo quận thì DIACHI phải tách", "Chỉ in lên giấy chứng nhận thì giữ nguyên một khối"], "note": "Với thuộc tính phức hợp ta được chọn. Với thuộc tính đa trị thì không.", "notes": "Nguyên tắc quyết định rất gọn: tách nếu về sau còn cần truy vấn theo từng phần riêng lẻ.\n\nÁp vào ví dụ cụ thể. Nếu trung tâm cần thống kê học viên theo quận để mở lớp vệ tinh thì địa chỉ phải tách, vì không tách thì mọi truy vấn đều phải cắt chuỗi.\n\nNgược lại nếu địa chỉ chỉ dùng để in lên giấy chứng nhận thì giữ nguyên một khối là đủ và còn đơn giản hơn. Điểm quan trọng nhất nằm ở khung dưới: với thuộc tính phức hợp ta được chọn, còn với thuộc tính đa trị thì không được chọn, và đó là nội dung của chặng tiếp theo."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Bài toán ba số điện thoại", "bullets": ["Học viên Trần An có ba số điện thoại", "Cách một: nhồi cả ba vào một ô, ngăn bằng dấu phẩy", "Cách hai: tạo ba cột SDT1, SDT2, SDT3", "Cách ba: tách thành thực thể riêng DIENTHOAI"], "note": "Ba cách, chỉ một cách đúng. Hãy thử đoán trước khi xem phân tích.", "notes": "Đề bài rất đời thường. Học viên Trần An khai ba số điện thoại, và câu hỏi là lưu thế nào cho đúng.\n\nCách thứ nhất là nhồi cả ba số vào một ô, ngăn cách bằng dấu phẩy. Đây là cách nhiều người làm khi vội.\n\nCách thứ hai là tạo ba cột riêng, đặt tên lần lượt là số điện thoại một, hai, ba. Cách này nhìn có vẻ ngăn nắp hơn.\n\nCách thứ ba là tách hẳn thành một thực thể riêng tên là điện thoại, nối với học viên bằng liên kết một nhiều. Hãy để lớp đoán xem cách nào đúng trước khi xem phân tích ở slide sau."}, {"layout": "image-text", "phase": "hinh-thanh", "minutes": 3, "title": "Ba cách xử lý, chỉ một cách đúng", "image": "hinh-ve/Chuong-2_Mo-hinh-ER_hinh04_681b36a1.png", "caption": "Hình 2.4. Ba cách xử lý thuộc tính đa trị và hệ quả của từng cách", "source": "Bai-giang_Chuong-2_Mo-hinh-ER.md, mục 2.2.4", "bullets": ["Cách một hỏng vì không tìm kiếm và kiểm tra được", "Cách hai hỏng vì phải sửa cấu trúc bảng", "Cách ba đúng: thêm số mới chỉ là thêm một dòng"], "notes": "Nhánh thứ nhất trên hình cho thấy hậu quả của việc nhồi vào một ô. Câu hỏi số này của ai buộc hệ thống dò từng chuỗi ký tự, và hệ quản trị không thể kiểm tra định dạng vì nó chỉ thấy một chuỗi văn bản.\n\nNhánh thứ hai cho thấy hậu quả nghiêm trọng hơn. Hôm nay ba cột là đủ, mai có người khai bốn số thì phải sửa cấu trúc bảng, đúng lỗi phụ thuộc dữ liệu đã chỉ ra ở Chương 1. Thêm nữa, nếu chín mươi phần trăm học viên chỉ có một số thì hai cột kia trống ở hầu hết các dòng.\n\nNhánh thứ ba là cách duy nhất đúng. Muốn thêm số thứ tư hay thứ mười chỉ cần thêm một dòng, không có ô trống nào, và tìm theo số điện thoại trở thành truy vấn bình thường."}, {"layout": "reveal", "phase": "luyen-tap", "minutes": 3, "title": "Kiểm chứng bằng bốn câu hỏi khó", "prompt": "Thử từng câu hỏi với cách hai là nhiều cột, rồi lật thẻ xem cách ba làm được gì.", "items": [{"q": "Học viên khai thêm số thứ tư thì phải làm gì?", "a": "Cách nhiều cột phải sửa cấu trúc bảng. Cách tách thực thể chỉ thêm một dòng."}, {"q": "Tìm chủ nhân của số 0906222 bằng cách nào?", "a": "Cách nhiều cột phải tìm trên cả ba cột. Cách tách thực thể là một truy vấn thường."}, {"q": "Đếm số học viên có trên hai số điện thoại?", "a": "Cách nhiều cột phải đếm ô không trống. Cách tách thực thể chỉ cần đếm theo nhóm."}], "notes": "Ba câu hỏi này là phép thử thực dụng cho mọi phương án thiết kế, không riêng gì bài này. Câu thứ nhất kiểm tra khả năng mở rộng, và đây là câu giết chết phương án nhiều cột.\n\nCâu thứ hai kiểm tra khả năng tìm kiếm ngược, tức là từ giá trị tìm ra chủ sở hữu.\n\nCâu thứ ba kiểm tra khả năng thống kê. Nếu lớp vẫn thấy phương án nhiều cột chấp nhận được thì hãy hỏi thêm rằng nếu có người khai mười số thì bảng sẽ ra sao, câu hỏi ấy thường đủ để thuyết phục."}, {"layout": "bullets", "phase": "hinh-thanh", "minutes": 2, "title": "Quy tắc dứt khoát về thuộc tính đa trị", "bullets": ["Thuộc tính đa trị luôn phải tách thành một thực thể riêng", "Đây là yêu cầu bắt buộc, không phải lời khuyên tùy hoàn cảnh", "Phản xạ cần luyện: thấy chữ nhiều thì đánh dấu để tách"], "note": "Nguyên tắc mỗi ô một giá trị đơn sẽ được gọi tên chính thức ở Chương 5 là dạng chuẩn 1.", "notes": "Quy tắc rút ra rất dứt khoát. Thuộc tính đa trị luôn phải tách thành một thực thể riêng, không có ngoại lệ.\n\nCần nhấn mạnh rằng đây là yêu cầu bắt buộc chứ không phải lời khuyên tùy hoàn cảnh. Ba cặp phân loại kia cho ta lựa chọn, riêng cặp đơn trị và đa trị thì không.\n\nPhản xạ cần luyện là hễ trong đề bài xuất hiện chữ nhiều đứng trước một đặc điểm, chẳng hạn nhiều số điện thoại, nhiều bằng cấp, nhiều kỹ năng, thì lập tức đánh dấu để tách. Nguyên tắc mỗi ô chứa đúng một giá trị đơn sẽ được gọi tên chính thức ở Chương 5 là dạng chuẩn một."}, {"layout": "practice", "phase": "luyen-tap", "minutes": 4, "title": "Phiếu thiết kế: thực thể SACH của thư viện", "duration": "4 phút", "form": "Nhóm hai người", "requirements": ["Liệt kê ít nhất năm thuộc tính cần lưu cho một cuốn sách", "Gắn cho mỗi thuộc tính đủ bốn nhãn phân loại", "Khoanh tròn thuộc tính đa trị và ghi cách tách nó"], "criteria": ["Có ít nhất một thuộc tính đa trị được nhận ra và tách đúng"], "hints": ["Mở rộng: tìm một thuộc tính dẫn xuất và lập luận nên lưu hay không"], "notes": "Nhiệm vụ thứ nhất là liệt kê ít nhất năm thuộc tính cho một cuốn sách. Đừng gợi ý sẵn, hãy để các nhóm tự nghĩ, vì chính chỗ khác nhau giữa các nhóm mới đáng bàn.\n\nNhiệm vụ thứ hai là gắn đủ bốn nhãn cho từng thuộc tính. Đây là chỗ luyện ý bốn cặp độc lập với nhau.\n\nNhiệm vụ thứ ba là khoanh tròn thuộc tính đa trị. Hầu hết các nhóm sẽ tìm ra tác giả hoặc từ khóa, và cả hai đều đúng. Nhóm nào xong sớm thì làm phần mở rộng ở dưới, tìm một thuộc tính dẫn xuất chẳng hạn số năm kể từ năm xuất bản, rồi lập luận nên lưu hay không."}, {"layout": "quiz", "phase": "cung-co", "minutes": 3, "title": "Kiểm tra cuối buổi", "question": "Một hồ sơ nhân sự cần lưu nhiều bằng cấp cho mỗi nhân viên. Cách xử lý nào đúng?", "options": ["Tạo các cột BANGCAP1, BANGCAP2, BANGCAP3 cho đủ dùng", "Ghi tất cả bằng cấp vào một ô, ngăn cách bằng dấu chấm phẩy", "Tách thành thực thể BANGCAP riêng, liên kết một nhiều với nhân viên"], "answer": 2, "explain": "Nhiều bằng cấp cho một nhân viên là thuộc tính đa trị, mà thuộc tính đa trị thì luôn phải tách thành thực thể riêng. Hai phương án kia lặp lại đúng hai sai lầm đã phân tích: nhiều cột thì phải sửa cấu trúc bảng khi có người nhiều bằng hơn dự kiến, còn nhồi một ô thì mất khả năng tìm kiếm và kiểm tra.", "notes": "Câu này đo đúng mục tiêu thứ tư của buổi học. Điểm mấu chốt là lớp có nhận ra cụm nhiều bằng cấp là dấu hiệu đa trị hay không, chứ không phải nhớ thuộc lòng đáp án. Nếu còn trên một phần tư lớp chọn phương án nhiều cột thì hãy hỏi lại câu hỏi kiểm chứng quen thuộc: nếu có người có bốn bằng thì sao. Đây cũng là nội dung sẽ dùng lại ngay ở phần ví dụ tổng hợp cuối chương."}, {"layout": "bullets", "phase": "cung-co", "minutes": 2, "role": "summary", "title": "Tóm tắt", "bullets": ["Quy tắc nghiệp vụ tốt phải đếm được và nêu cả hai chiều", "Lược đồ ER gồm ba thành phần: thực thể, thuộc tính, liên kết", "Danh từ thành thực thể khi đạt cả ba tiêu chí", "Thuộc tính có bốn cặp phân loại độc lập nhau", "Thuộc tính đa trị luôn phải tách thành thực thể riêng"], "note": "Trả lời câu hỏi đầu buổi: từ lời sang hình đi qua bảng phiên dịch, rồi lọc bằng tiêu chí.", "notes": "Điểm thứ nhất là về nguyên liệu. Quy tắc nghiệp vụ tốt phải đếm được và phải nêu cả hai chiều, thiếu chiều nào thì hỏi lại chứ không tự đoán.\n\nĐiểm thứ hai là về sản phẩm. Lược đồ ER gồm ba thành phần cơ bản, và chỉ với chữ nhật, oval, hình thoi là đã đọc được phần lớn lược đồ gặp trong thực tế.\n\nĐiểm thứ ba là tiêu chí lọc. Một danh từ chỉ thành thực thể khi đạt cả ba tiêu chí, thiếu một thì nó thường chỉ là thuộc tính.\n\nĐiểm thứ tư là bốn cặp phân loại thuộc tính, độc lập nhau nên mỗi thuộc tính mang bốn nhãn.\n\nĐiểm thứ năm là quy tắc bắt buộc duy nhất của buổi hôm nay. Nhìn lại câu hỏi xuyên suốt nêu ở đầu buổi, con đường từ lời sang hình đi qua bảng phiên dịch rồi lọc lại bằng tiêu chí, chứ không đi bằng cảm tính."}, {"layout": "bullets", "phase": "cung-co", "minutes": 2, "role": "homework", "title": "Bài tập và chuẩn bị", "bullets": ["Bài tập Mức A: phân loại thuộc tính cho thực thể GIAOVIEN", "Bài tập Mức B: viết bốn quy tắc đếm được cho quán cà phê", "Đọc trước mục 2.3 và 2.4 của bài giảng", "Mở rộng: tìm một hệ thống thật có thuộc tính đa trị chưa tách"], "note": "Phần tiếp theo trả lời câu hỏi: làm sao phân biệt hai cá thể của cùng một thực thể?", "notes": "Bài tập mức A yêu cầu phân loại thuộc tính cho thực thể giáo viên, làm đúng như phiếu luyện tập vừa rồi nhưng làm một mình.\n\nBài tập mức B khó hơn, yêu cầu tự viết bốn quy tắc nghiệp vụ đếm được cho một quán cà phê. Tiêu chí chấm là có nêu đủ hai chiều hay không.\n\nCần đọc trước mục hai chấm ba và hai chấm bốn để phần sau đỡ nặng.\n\nPhần mở rộng dành cho ai muốn làm thêm, tìm một hệ thống thật đang mắc lỗi đa trị chưa tách, chẳng hạn một biểu mẫu đăng ký trực tuyến. Phần tiếp theo của chương sẽ trả lời câu hỏi ghi ở khung dưới, là làm sao phân biệt hai cá thể của cùng một thực thể."}], "_phase": {"khoi-dong": "Khởi động", "hinh-thanh": "Hình thành kiến thức", "luyen-tap": "Luyện tập", "van-dung": "Vận dụng", "cung-co": "Củng cố & đánh giá"}, "_objvn": {"knowledge": "Kiến thức", "skill": "Kỹ năng", "attitude": "Thái độ / Năng lực"}, "_order": {"18": [1, 4, 2, 0, 3], "32": [1, 4, 2, 0, 3]}, "_steps": {"0": 0, "1": 5, "2": 4, "3": 4, "4": 0, "5": 3, "6": 3, "7": 4, "8": 3, "9": 5, "10": 3, "11": 3, "12": 3, "13": 3, "14": 3, "15": 4, "16": 0, "17": 6, "18": 0, "19": 3, "20": 4, "21": 3, "22": 0, "23": 3, "24": 3, "25": 3, "26": 4, "27": 4, "28": 4, "29": 0, "30": 4, "31": 3, "32": 0, "33": 3, "34": 4, "35": 3, "36": 3, "37": 3, "38": 3, "39": 0, "40": 5, "41": 4}, "_np": {"0": ["Xin chào cả lớp. Hôm nay chúng ta bắt đầu Chương 2, chương dạy cách thiết kế cơ sở dữ liệu bằng phương pháp thay vì bằng cảm tính. Chương 1 đã cho thấy một bảng phẳng sinh ra ba loại dị thường, và cách chữa là tách bảng. Nhưng cách tách ấy dựa vào mắt nhìn. Chương 2 thay mắt nhìn bằng một quy trình có thể kiểm chứng được. Phần đầu tiên trong bốn phần hôm nay đi từ nguyên liệu là quy tắc nghiệp vụ, tới sản phẩm là lược đồ ER, rồi vào hai thành phần đầu tiên của lược đồ là thực thể và thuộc tính."], "1": ["Mục tiêu thứ nhất là nêu được vai trò của quy tắc nghiệp vụ. Đây là thứ quyết định mọi việc còn lại, vì thiết kế sai gần như luôn bắt nguồn từ việc hiểu sai nghiệp vụ chứ không phải từ việc vẽ xấu.", "Mục tiêu thứ hai là đọc được một lược đồ ER nhỏ. Đọc trước rồi mới vẽ, giống như học đọc bản đồ trước khi tự vẽ bản đồ.", "Mục tiêu thứ ba là phân loại thuộc tính theo bốn cặp tiêu chí. Bốn cặp này độc lập nhau, nên một thuộc tính mang bốn nhãn cùng lúc.", "Mục tiêu thứ tư là xử lý đúng thuộc tính đa trị. Đây là quyết định thiết kế đầu tiên trong chương chỉ có một đáp án đúng duy nhất.", "Mục tiêu cuối cùng thuộc về thái độ nghề nghiệp: đánh giá được một phát biểu của khách hàng có dùng được hay không, và biết hỏi lại khi nó còn mơ hồ."], "2": ["Chặng thứ nhất trả lời câu hỏi nguyên liệu ở đâu ra. Thiết kế không bắt đầu từ bảng biểu mà bắt đầu từ lời kể của người dùng hệ thống.", "Chặng thứ hai cho thấy sản phẩm cuối cùng trông thế nào. Nhìn thấy đích trước thì các khái niệm ở giữa mới có chỗ để gắn vào.", "Chặng thứ ba đi vào thành phần đầu tiên của lược đồ, và câu hỏi khó ở đây là khi nào một danh từ xứng đáng trở thành thực thể.", "Chặng thứ tư là thuộc tính, với bốn cặp phân loại và một ca đặc biệt bắt buộc phải xử lý. Câu hỏi xuyên suốt cả buổi nằm ở khung dưới, và cuối buổi chúng ta sẽ quay lại trả lời nó."], "3": ["Trực giác có một đặc điểm nguy hiểm. Nó hoạt động rất tốt trên bài toán nhỏ, nên người ta tin tưởng nó.", "Rồi người ta mang nó áp cho bài toán lớn và thất bại. Với một hệ thống bốn mươi bảng, không mắt người nào nhìn ra hết chỗ dư thừa.", "Tệ hơn nữa là hai người cùng dùng trực giác sẽ cho hai kết quả khác nhau, và không ai có cơ sở gì để nói ai đúng. Thiết kế trở thành chuyện tranh cãi cảm tính.", "Vấn đề sâu nhất nằm ở dòng cuối. Trực giác chỉ nhìn được vào dữ liệu đã có sẵn, trong khi công việc thật của người thiết kế thường bắt đầu lúc chưa có bảng nào để mà nhìn."], "4": ["Câu này để đo xem lớp đang nghĩ thiết kế là gì. Ai chọn phương án đầu tiên thì đang hiểu thiết kế là dọn dẹp dữ liệu, và đó chính là hiểu lầm mà cả chương này sửa. Nếu quá một nửa lớp chọn phương án đó thì phần lộ trình phía trước cần giảng chậm hơn và nhấn kỹ vào ý dữ liệu hiện có chỉ phản ánh phần rất nhỏ của nghiệp vụ. Ai chọn phương án cuối thì cần nói rõ ngay rằng không có con số tối thiểu nào cả, số thực thể do nghiệp vụ quyết định."], "5": ["Mức quan niệm trả lời câu hỏi nghiệp vụ có những gì. Kết quả là một lược đồ ER mô tả thế giới thực, hoàn toàn độc lập với mọi công nghệ. Toàn bộ chương này nằm ở mức đó.", "Mức logic trả lời câu hỏi tổ chức thành bảng ra sao. Kết quả là một tập các quan hệ có khóa chính và khóa ngoại đầy đủ. Đó là Chương 3 và một phần Chương 5.", "Mức vật lý trả lời câu hỏi lưu lên đĩa thế nào, gồm chọn kiểu dữ liệu, tạo chỉ mục, phân vùng. Phần này thuộc học phần Hệ quản trị cơ sở dữ liệu, ta chỉ cần biết nó tồn tại."], "6": ["Sai lầm phổ biến nhất của người mới học là đọc xong đề bài liền vẽ bảng ngay, bỏ qua mức quan niệm. Cảm giác lúc đó là mình đang tiết kiệm thời gian.", "Hậu quả là thiết kế bám sát cách diễn đạt tình cờ của đề bài thay vì bám sát bản chất nghiệp vụ. Đề viết theo thứ tự nào thì bảng ra theo thứ tự đó.", "Và khi nghiệp vụ thay đổi một chút thôi thì toàn bộ thiết kế phải làm lại từ đầu. Thời gian tiết kiệm được ở bước đầu phải trả lại gấp nhiều lần ở bước sau."], "7": ["Định nghĩa rất gọn. Quy tắc nghiệp vụ là một phát biểu ngắn, rõ ràng, viết bằng ngôn ngữ tự nhiên chứ không phải bằng ký hiệu kỹ thuật.", "Nội dung của nó là một chính sách, một quy trình hoặc một ràng buộc trong hoạt động của tổ chức. Bất cứ điều gì tổ chức quy định đều có thể thành quy tắc.", "Nguồn thứ nhất là phỏng vấn những người thật sự dùng hệ thống. Đây là nguồn giàu thông tin nhất và cũng dễ bị bỏ qua nhất.", "Hai nguồn còn lại là đọc tài liệu, biểu mẫu hiện hành, và quan sát quy trình làm việc thực tế. Cả ba đều là công việc của con người với con người, không phải công việc kỹ thuật, nhưng chất lượng toàn bộ thiết kế phụ thuộc vào nó."], "8": ["Vai trò thứ nhất là xác định phạm vi. Không phải mọi thứ trong đời thực đều cần đưa vào hệ thống, và ranh giới ấy do quy tắc nghiệp vụ vạch ra.", "Vai trò thứ hai là quyết định cấu trúc. Mỗi quy tắc thường ứng với một thành phần cụ thể của lược đồ, và lát nữa chúng ta sẽ có hẳn một bảng phiên dịch.", "Vai trò thứ ba là làm căn cứ tranh luận. Khi hai người thiết kế bất đồng, cách giải quyết không phải là ai lớn tiếng hơn mà là quay lại đọc quy tắc nghiệp vụ. Đây là điều làm cho thiết kế trở thành một nghề có kỷ luật."], "9": ["Phát biểu thứ nhất nghe rất kêu nhưng không phải quy tắc nghiệp vụ. Nó không cho biết cần lưu gì, cũng không nêu ràng buộc nào, nên người thiết kế không rút ra được điều gì.", "Phát biểu thứ hai đã chấp nhận được nhưng chưa đủ. Nó cho biết một chiều của mối liên hệ và bỏ mất chiều kia, mà chiều kia mới là chỗ hay sai.", "Sang cột phải, câu thứ nhất cho biết chiều đi từ học viên sang lớp.", "Câu thứ hai bổ sung chiều ngược lại, và chỉ khi có đủ hai chiều ta mới kết luận được loại liên kết.", "Câu thứ ba nói rằng mỗi lượt ghi danh có dữ liệu riêng. Ba câu ấy gộp lại cho ta hai kết luận thiết kế ngay lập tức, ghi ở khung dưới."], "10": ["Đặc điểm thứ nhất là nói về một sự việc cụ thể. Cảm nhận chung kiểu quản lý chặt chẽ hay phục vụ tận tâm đều không dùng được.", "Đặc điểm thứ hai là dùng các từ chỉ số lượng, để người đọc đếm được. Chính những từ này về sau trở thành con số trên cạnh nối của lược đồ.", "Đặc điểm thứ ba là nêu cả hai chiều. Khi khách hàng chỉ nói một chiều, nhiệm vụ của người thiết kế không phải là tự đoán mà là hỏi lại cho rõ. Câu hỏi hữu ích nhất luôn có dạng một X thì liên quan tới bao nhiêu Y, và phải hỏi cả chiều ngược lại."], "11": ["Phát biểu thứ nhất mắc lỗi dùng từ linh hoạt, một từ không đếm được. Hãy để lớp thử sửa trong ba mươi giây rồi mới lật thẻ. Bản sửa nêu rõ hai chiều giữa lớp và phòng học.", "Phát biểu thứ hai mắc lỗi nói về khả năng chung chung thay vì nói về ràng buộc. Bản sửa nêu đủ hai chiều và giữ lại cụm chưa lớp nào, vì cụm ấy sẽ thành tính tham gia tùy chọn.", "Phát biểu thứ ba nghe như đã rõ nhưng thật ra chưa nói học phí gắn vào đâu. Bản sửa gắn nó vào từng lượt ghi danh, và đó chính là manh mối dẫn tới một thực thể mới ở buổi sau. Nếu lớp sửa mà vẫn quên nêu hai chiều thì quay lại slide ba đặc điểm và nhấn lại tiêu chí thứ ba."], "12": ["Đến đây chúng ta đã có nguyên liệu trong tay, tức là các quy tắc nghiệp vụ đã đủ rõ để đếm được.", "Câu hỏi tự nhiên tiếp theo là sản phẩm làm ra từ nguyên liệu ấy trông như thế nào. Rất khó học các thành phần khi chưa từng thấy cái toàn thể.", "Vì vậy chặng tới sẽ xem một lược đồ ER hoàn chỉnh nhưng cỡ nhỏ, chỉ vừa đủ để nhận ra ba loại hình vẽ."], "13": ["Đây là toàn bộ sản phẩm của thiết kế quan niệm, thu nhỏ lại vừa một màn hình. Hai hình chữ nhật là hai loại sự vật mà trung tâm cần lưu thông tin, gọi là thực thể.", "Các hình oval nối vào chữ nhật là những đặc điểm cần lưu của sự vật đó, gọi là thuộc tính. Chú ý hai oval có tên được gạch chân, lát nữa ta sẽ nói vì sao.", "Hình thoi nằm giữa hai chữ nhật là mối liên hệ giữa chúng, gọi là liên kết, và bên trong luôn ghi một động từ. Điều đáng nói là chủ trung tâm, người không biết gì về cơ sở dữ liệu, vẫn nhìn hình này và chỉ ra được chỗ sai. Đó là giá trị lớn nhất của mô hình ER và là lý do nó sống gần năm mươi năm."], "14": ["Thành phần thứ nhất là thực thể, vẽ bằng hình chữ nhật. Đây là loại sự vật hoặc sự kiện mà tổ chức cần lưu thông tin về nó.", "Thành phần thứ hai là thuộc tính, vẽ bằng hình oval nối vào thực thể bằng một đoạn thẳng. Mỗi oval là một đặc điểm cần lưu.", "Thành phần thứ ba là liên kết, vẽ bằng hình thoi đặt giữa hai thực thể. Chỉ cần ba loại hình này là đã đọc được phần lớn các lược đồ ER. Những ký hiệu còn lại đều là sắc thái thêm vào ba loại cơ bản ấy, và ta sẽ học đủ bộ ở phần sau."], "15": ["Cách đọc một lược đồ ER rất máy móc, và đó là ưu điểm. Ta đọc theo mẫu danh từ, động từ, danh từ, tức là tên thực thể, tên liên kết, tên thực thể kia.", "Áp vào hình vừa xem, chiều thứ nhất đọc là một giáo viên phụ trách nhiều lớp. Con số M ở đầu phía lớp cho biết chữ nhiều đó.", "Chiều thứ hai đọc ngược lại là một lớp do một giáo viên phụ trách, nhờ con số một ở đầu phía giáo viên.", "Kinh nghiệm quan trọng nhất nằm ở dòng cuối. Hãy tập đọc lược đồ thành tiếng. Khi câu đọc lên nghe vô lý thì lược đồ sai, và cách kiểm tra ấy nhanh hơn mọi cách kiểm tra khác."], "16": ["Đây là bài kiểm tra kỹ năng đọc, và cũng là chỗ bẫy quen thuộc. Rất nhiều người nhìn thấy chữ M cạnh lớp rồi kết luận một lớp có nhiều giáo viên. Nếu quá một phần ba lớp chọn phương án đầu tiên thì cần dừng lại làm mẫu trên bảng thêm một liên kết nữa, và nhắc lại mẹo che một đầu rồi đọc đầu còn lại. Cũng nói luôn rằng một số tài liệu ghi con số theo quy ước ngược, nên khi đọc lược đồ của người khác việc đầu tiên là kiểm tra quy ước bằng một liên kết mình đã chắc chắn."], "17": ["Bảng phiên dịch này nối nguyên liệu với sản phẩm. Loại từ trong câu quy tắc gợi ý loại thành phần trong lược đồ.", "Danh từ chỉ sự vật cần lưu thông tin thường thành thực thể. Ví dụ câu trung tâm có nhiều giáo viên cho ta thực thể giáo viên.", "Động từ nối hai danh từ thường thành liên kết. Ví dụ mỗi lớp do một giáo viên phụ trách cho ta liên kết phụ trách.", "Còn từ chỉ số lượng thì quyết định loại kết nối. Bên phải là ba thành phần tương ứng, đúng ba hình vẽ ta vừa học.", "Hình thoi mang tên động từ chính là lý do Chen dành hẳn một ký hiệu riêng cho liên kết.", "Cần nhấn mạnh dòng dưới cùng: đây là gợi ý khởi đầu chứ không phải quy tắc tuyệt đối. Không phải danh từ nào cũng thành thực thể, và tiêu chí phân biệt sẽ có ngay sau đây."], "18": ["Bài ghép này rèn phản xạ phiên dịch, và hai cặp cuối cùng là hai cụm từ quan trọng nhất cần nhớ. Cụm có thể và cụm chưa báo hiệu tính tham gia tùy chọn, còn chữ nhiều đứng trước một đặc điểm báo hiệu thuộc tính đa trị. Hai thứ này ta chưa học kỹ, nên chỉ cần nhận mặt được là đủ, buổi sau và phần cuối buổi này sẽ nói rõ. Nếu lớp ghép sai nhiều ở cặp thứ ba thì nhắc lại rằng từ chỉ số lượng quyết định kết nối chứ không quyết định liên kết."], "19": ["Chúng ta đã có bản đồ phiên dịch từ lời nói sang hình vẽ, đủ để bắt đầu làm việc.", "Nhưng bảng ấy chỉ là gợi ý, và câu hỏi khó vẫn còn nguyên: khi nào một danh từ thật sự đáng trở thành thực thể.", "Phần còn lại của buổi trả lời câu hỏi đó, rồi học đủ bộ ký hiệu Chen, và cuối cùng đi sâu vào thuộc tính."], "20": ["Thực thể, nói chính xác hơn là kiểu thực thể, là một loại sự vật hoặc sự kiện mà tổ chức cần lưu trữ thông tin về nó.", "Thể hiện thực thể là một cá thể cụ thể thuộc loại ấy. Hai khái niệm này khác nhau về cấp độ chứ không khác nhau về nội dung.", "Lấy ví dụ cho dễ hình dung. Học viên là một thực thể, nó là cái khuôn mô tả rằng mọi học viên đều có mã, họ tên, ngày sinh. Còn dòng ghi mã HV01, tên Trần An, sinh năm 2005 là một thể hiện, tức một cá thể đúc ra từ khuôn ấy.", "Hệ quả thực hành nằm ở dòng cuối. Trong lược đồ ta chỉ vẽ thực thể; các thể hiện chỉ xuất hiện khi hệ thống đã chạy và có dữ liệu thật. Khung dưới nhắc rằng đây đúng là cặp lược đồ và thể hiện đã gặp ở Chương 1, chỉ đổi tên gọi."], "21": ["Tiêu chí thứ nhất là có nhiều hơn một đặc điểm cần lưu. Nếu về màu sắc ta chỉ cần lưu đúng tên màu thì màu sắc nên là thuộc tính. Nhưng nếu còn cần mã màu, nhà cung cấp sơn và ngày cập nhật thì nó đã đủ tư cách làm thực thể.", "Tiêu chí thứ hai là có nhiều cá thể phân biệt được. Một sự vật chỉ tồn tại đúng một bản, chẳng hạn bản thân trung tâm ABC, thì không nên làm thực thể vì bảng tương ứng chỉ có một dòng.", "Tiêu chí thứ ba là có liên kết với sự vật khác. Một danh từ đứng biệt lập, không liên hệ với bất cứ gì trong hệ thống, thường là dấu hiệu nó nằm ngoài phạm vi bài toán và nên bỏ đi."], "22": ["Điểm cần rút ra không phải là đáp án mà là cách lập luận. Cùng một danh từ có thể là thuộc tính ở hệ thống này và là thực thể ở hệ thống khác, tùy nghiệp vụ cần lưu bao nhiêu đặc điểm. Nếu lớp trả lời sai thì đừng vội chữa, hãy hỏi ngược lại rằng nếu cửa hàng chỉ cần lưu tên màu thôi thì câu trả lời có đổi không. Chính câu hỏi ấy dạy được điều mà đáp án không dạy được."], "23": ["Hình này là bộ ký hiệu đầy đủ, mở rộng từ ba hình cơ bản đã học. Oval có tên gạch chân là thuộc tính khóa, dùng để phân biệt các cá thể với nhau. Chi tiết về khóa sẽ học ở phần sau của chương.", "Oval hai đường viền là thuộc tính đa trị, còn oval nét đứt là thuộc tính dẫn xuất. Cả hai đều sẽ được nói kỹ ở cuối buổi hôm nay.", "Chữ nhật hai đường viền là thực thể yếu, nối qua hình thoi hai viền gọi là liên kết định danh. Phần này để dành cho buổi sau, bây giờ chỉ cần nhận mặt. Một lưu ý về hình vẽ: công cụ vẽ thể hiện oval thành hình bo tròn hai đầu và thể hiện hai đường viền bằng viền dày, nhưng khi vẽ tay thì hãy vẽ oval thật và hai viền thật."], "24": ["Lý do thứ nhất là tính chính danh. Đây là ký pháp gốc, do chính Peter Chen đề xuất năm 1976 cùng với mô hình ER.", "Lý do thứ hai là tính tường minh. Mỗi khái niệm có một ký hiệu riêng nên nhìn vào hình là đọc ra ngay, không cần tra bảng quy ước kèm theo.", "Lý do thứ ba quan trọng nhất về mặt sư phạm. Chen buộc người vẽ phải nghĩ: muốn vẽ thuộc tính đa trị phải cố tình vẽ hai đường viền, muốn vẽ thuộc tính khóa phải cố tình gạch chân. Mỗi nét vẽ là một quyết định thiết kế được ghi lại. Ký pháp Crow's Foot gọn hơn nhưng giấu bớt các quyết định ấy đi, nên hợp giai đoạn làm tài liệu hơn là giai đoạn học."], "25": ["Định nghĩa rất ngắn. Thuộc tính là một đặc điểm của thực thể mà ta cần lưu trữ, vẽ bằng hình oval nối vào chữ nhật.", "Điều cần nhớ là bốn cặp tiêu chí sắp trình bày hoàn toàn độc lập với nhau. Chúng không loại trừ nhau và cũng không suy ra được nhau.", "Hệ quả là mỗi thuộc tính mang bốn nhãn cùng lúc, mỗi cặp một nhãn. Ví dụ ở khung dưới cho thấy địa chỉ có thể vừa phức hợp, vừa đơn trị, vừa lưu trữ, vừa bắt buộc. Bốn slide tiếp theo đi lần lượt từng cặp."], "26": ["Thuộc tính đơn là thứ không chia nhỏ được nữa mà vẫn giữ nguyên ý nghĩa.", "Các ví dụ quen thuộc là ngày sinh, họ tên, mã học viên. Chúng đứng một mình đã đủ nghĩa.", "Thuộc tính phức hợp thì gồm nhiều phần, và điều quan trọng là từng phần đều có nghĩa riêng.", "Địa chỉ là ví dụ điển hình, gồm số nhà, tên đường, quận và tỉnh. Câu hỏi thiết kế đặt ra ngay: tách thành các thuộc tính con hay giữ nguyên một khối. Nguyên tắc ghi ở khung dưới, và ta sẽ quay lại nó sau vài slide."], "27": ["Thuộc tính đơn trị nghĩa là mỗi cá thể chỉ có đúng một giá trị cho đặc điểm ấy.", "Họ tên và ngày sinh của học viên là ví dụ. Một người chỉ có một ngày sinh.", "Thuộc tính đa trị thì ngược lại, một cá thể có thể có nhiều giá trị cùng lúc.", "Số điện thoại của học viên là ví dụ kinh điển, bằng cấp của giáo viên cũng vậy. Hãy nhớ kỹ cặp này, vì như khung dưới ghi, đây là cặp duy nhất trong bốn cặp dẫn tới một quyết định bắt buộc chứ không phải một lựa chọn. Cuối buổi ta sẽ dành hẳn một chặng cho nó."], "28": ["Thuộc tính lưu trữ là thứ được nhập vào và cất giữ trong hệ thống.", "Ngày sinh là ví dụ. Không có cách nào tính ra ngày sinh từ dữ liệu khác, buộc phải hỏi và ghi lại.", "Thuộc tính dẫn xuất thì tính ra được từ thuộc tính khác, nên về nguyên tắc không cần lưu.", "Tuổi tính từ ngày sinh là ví dụ rõ nhất. Trong ký pháp Chen ta vẫn vẽ nó ra bằng oval nét đứt, để ghi nhận rằng nghiệp vụ có nhu cầu này, nhưng đánh dấu riêng để người làm bước sau biết nó không cần một cột trong bảng. Cuối buổi sẽ có một câu thảo luận về chuyện lưu hay không lưu."], "29": ["Đây là câu hỏi mở, không có đáp án duy nhất, và mục đích là tập cân nhắc đánh đổi. Nguyên tắc chung là không lưu thuộc tính dẫn xuất, vì lưu lại chính là tạo ra dư thừa, mà dư thừa dẫn tới không nhất quán đúng theo chuỗi nhân quả của Chương 1.", "Nhưng ngoại lệ có thật khi phép tính quá tốn kém và được dùng liên tục, chẳng hạn phải đếm lại trên hàng vạn dòng ghi danh mỗi lần hiển thị danh sách lớp.", "Khi ấy người ta chấp nhận lưu, nhưng phải kèm cơ chế bảo đảm nó luôn khớp. Hãy dẫn lớp tới ý đó thay vì đưa đáp án sẵn. Tình huống này sẽ quay lại ở Chương 4 dưới dạng một ràng buộc toàn vẹn khó, và ở Chương 5 dưới tên gọi phi chuẩn hóa."], "30": ["Thuộc tính bắt buộc là thứ không được để trống trong bất kỳ trường hợp nào.", "Họ tên học viên là ví dụ. Một dòng dữ liệu không có họ tên thì vô nghĩa.", "Thuộc tính tùy chọn thì được phép để trống mà dữ liệu vẫn có ý nghĩa.", "Địa chỉ thư điện tử là ví dụ, vì có học viên lớn tuổi không dùng thư điện tử. Cặp này nhìn có vẻ nhỏ nhưng ở Chương 3 nó sẽ trở thành ràng buộc không rỗng trên cột, và xác định sai thì hệ thống hoặc từ chối dữ liệu hợp lệ, hoặc nhận vào dữ liệu thiếu."], "31": ["Hai cách vẽ chứa cùng một lượng thông tin nhưng phân bố khác hẳn nhau. Bên trái là Chen, trải thuộc tính ra ngoài thành các oval riêng biệt.", "Bên phải là Crow's Foot, gom thuộc tính vào trong một ô chữ nhật thành danh sách, mỗi thuộc tính một dòng. Gọn hơn rất nhiều.", "Điều đáng nói là cái giá của sự gọn gàng. Vì mỗi thuộc tính chỉ còn là một dòng chữ nên Crow's Foot mất chỗ để thể hiện các sắc thái, thường chỉ giữ lại được gạch chân cho khóa. Đó chính là lý do giáo trình chọn Chen cho phần học lý thuyết và phần giải bài, còn Crow's Foot dùng khi cần trình bày lược đồ lớn."], "32": ["Bài ghép này kiểm tra giữa buổi. Lưu ý với lớp rằng mỗi thuộc tính thật ra mang bốn nhãn cùng lúc, ở đây ta chỉ hỏi nhãn nổi bật nhất của từng cái. Cặp cuối cùng cố tình ghép hai nhãn để lớp thấy điều đó. Nếu có nhóm ghép nhầm đa trị với phức hợp thì đây là chỗ cần dừng lại, vì hai khái niệm này rất hay lẫn: phức hợp là một giá trị chia được thành nhiều phần, còn đa trị là nhiều giá trị riêng biệt của cùng một đặc điểm."], "33": ["Nguyên tắc quyết định rất gọn: tách nếu về sau còn cần truy vấn theo từng phần riêng lẻ.", "Áp vào ví dụ cụ thể. Nếu trung tâm cần thống kê học viên theo quận để mở lớp vệ tinh thì địa chỉ phải tách, vì không tách thì mọi truy vấn đều phải cắt chuỗi.", "Ngược lại nếu địa chỉ chỉ dùng để in lên giấy chứng nhận thì giữ nguyên một khối là đủ và còn đơn giản hơn. Điểm quan trọng nhất nằm ở khung dưới: với thuộc tính phức hợp ta được chọn, còn với thuộc tính đa trị thì không được chọn, và đó là nội dung của chặng tiếp theo."], "34": ["Đề bài rất đời thường. Học viên Trần An khai ba số điện thoại, và câu hỏi là lưu thế nào cho đúng.", "Cách thứ nhất là nhồi cả ba số vào một ô, ngăn cách bằng dấu phẩy. Đây là cách nhiều người làm khi vội.", "Cách thứ hai là tạo ba cột riêng, đặt tên lần lượt là số điện thoại một, hai, ba. Cách này nhìn có vẻ ngăn nắp hơn.", "Cách thứ ba là tách hẳn thành một thực thể riêng tên là điện thoại, nối với học viên bằng liên kết một nhiều. Hãy để lớp đoán xem cách nào đúng trước khi xem phân tích ở slide sau."], "35": ["Nhánh thứ nhất trên hình cho thấy hậu quả của việc nhồi vào một ô. Câu hỏi số này của ai buộc hệ thống dò từng chuỗi ký tự, và hệ quản trị không thể kiểm tra định dạng vì nó chỉ thấy một chuỗi văn bản.", "Nhánh thứ hai cho thấy hậu quả nghiêm trọng hơn. Hôm nay ba cột là đủ, mai có người khai bốn số thì phải sửa cấu trúc bảng, đúng lỗi phụ thuộc dữ liệu đã chỉ ra ở Chương 1. Thêm nữa, nếu chín mươi phần trăm học viên chỉ có một số thì hai cột kia trống ở hầu hết các dòng.", "Nhánh thứ ba là cách duy nhất đúng. Muốn thêm số thứ tư hay thứ mười chỉ cần thêm một dòng, không có ô trống nào, và tìm theo số điện thoại trở thành truy vấn bình thường."], "36": ["Ba câu hỏi này là phép thử thực dụng cho mọi phương án thiết kế, không riêng gì bài này. Câu thứ nhất kiểm tra khả năng mở rộng, và đây là câu giết chết phương án nhiều cột.", "Câu thứ hai kiểm tra khả năng tìm kiếm ngược, tức là từ giá trị tìm ra chủ sở hữu.", "Câu thứ ba kiểm tra khả năng thống kê. Nếu lớp vẫn thấy phương án nhiều cột chấp nhận được thì hãy hỏi thêm rằng nếu có người khai mười số thì bảng sẽ ra sao, câu hỏi ấy thường đủ để thuyết phục."], "37": ["Quy tắc rút ra rất dứt khoát. Thuộc tính đa trị luôn phải tách thành một thực thể riêng, không có ngoại lệ.", "Cần nhấn mạnh rằng đây là yêu cầu bắt buộc chứ không phải lời khuyên tùy hoàn cảnh. Ba cặp phân loại kia cho ta lựa chọn, riêng cặp đơn trị và đa trị thì không.", "Phản xạ cần luyện là hễ trong đề bài xuất hiện chữ nhiều đứng trước một đặc điểm, chẳng hạn nhiều số điện thoại, nhiều bằng cấp, nhiều kỹ năng, thì lập tức đánh dấu để tách. Nguyên tắc mỗi ô chứa đúng một giá trị đơn sẽ được gọi tên chính thức ở Chương 5 là dạng chuẩn một."], "38": ["Nhiệm vụ thứ nhất là liệt kê ít nhất năm thuộc tính cho một cuốn sách. Đừng gợi ý sẵn, hãy để các nhóm tự nghĩ, vì chính chỗ khác nhau giữa các nhóm mới đáng bàn.", "Nhiệm vụ thứ hai là gắn đủ bốn nhãn cho từng thuộc tính. Đây là chỗ luyện ý bốn cặp độc lập với nhau.", "Nhiệm vụ thứ ba là khoanh tròn thuộc tính đa trị. Hầu hết các nhóm sẽ tìm ra tác giả hoặc từ khóa, và cả hai đều đúng. Nhóm nào xong sớm thì làm phần mở rộng ở dưới, tìm một thuộc tính dẫn xuất chẳng hạn số năm kể từ năm xuất bản, rồi lập luận nên lưu hay không."], "39": ["Câu này đo đúng mục tiêu thứ tư của buổi học. Điểm mấu chốt là lớp có nhận ra cụm nhiều bằng cấp là dấu hiệu đa trị hay không, chứ không phải nhớ thuộc lòng đáp án. Nếu còn trên một phần tư lớp chọn phương án nhiều cột thì hãy hỏi lại câu hỏi kiểm chứng quen thuộc: nếu có người có bốn bằng thì sao. Đây cũng là nội dung sẽ dùng lại ngay ở phần ví dụ tổng hợp cuối chương."], "40": ["Điểm thứ nhất là về nguyên liệu. Quy tắc nghiệp vụ tốt phải đếm được và phải nêu cả hai chiều, thiếu chiều nào thì hỏi lại chứ không tự đoán.", "Điểm thứ hai là về sản phẩm. Lược đồ ER gồm ba thành phần cơ bản, và chỉ với chữ nhật, oval, hình thoi là đã đọc được phần lớn lược đồ gặp trong thực tế.", "Điểm thứ ba là tiêu chí lọc. Một danh từ chỉ thành thực thể khi đạt cả ba tiêu chí, thiếu một thì nó thường chỉ là thuộc tính.", "Điểm thứ tư là bốn cặp phân loại thuộc tính, độc lập nhau nên mỗi thuộc tính mang b
